name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The server's tests run against a real, throwaway database, and read the
    # emails they send from Mailpit.
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_DB: acme
          POSTGRES_PASSWORD: acme
          POSTGRES_USER: acme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username acme --dbname acme"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DO_NOT_TRACK: "1"
      NX_NO_CLOUD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      # The media tests store files in the development stack's S3 store, on
      # the port and synthetic credentials compose.yaml defaults to.
      - run: docker compose --file packages/acme-docker/compose.yaml up --detach --wait seaweedfs
      - run: bun run test
        env:
          DATABASE_URL: postgres://acme:acme@localhost:5432/acme
          MAILPIT_URL: http://localhost:8025
          SMTP_URL: smtp://localhost:1025
      - run: bun run build
