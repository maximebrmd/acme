name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The server's tests run against a real, throwaway database, read the
    # emails they send from Mailpit, and check checkout and the billing portal
    # against stripe-mock.
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_DB: peal
          POSTGRES_PASSWORD: peal
          POSTGRES_USER: peal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username peal --dbname peal"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        env:
          MP_SMTP_DISABLE_RDNS: "true"
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78
        ports:
          - 12111:12111
        options: >-
          --health-cmd "nc -z 127.0.0.1 12111"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DO_NOT_TRACK: "1"
      NX_NO_CLOUD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # The Ansible toolchain in packages/peal-infra/ansible, which `bun run test`
      # lints and syntax-checks.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      # The media tests store files in the development stack's S3 store, on
      # the port and synthetic credentials compose.yaml defaults to.
      - run: docker compose --file packages/peal-docker/compose.yaml up --detach --wait seaweedfs
      - run: bun run test
        env:
          DATABASE_URL: postgres://peal:peal@localhost:5432/peal
          MAILPIT_URL: http://localhost:8025
          SMTP_URL: smtp://localhost:1025
          STRIPE_MOCK_URL: http://localhost:12111
      - run: bun run build

  # Every commit of the repository, which is public, scanned for secrets with
  # Betterleaks, at medium confidence and above, with the rules and the
  # filter of .betterleaks.toml. The whole history takes seconds, and a
  # secret committed once stays readable even after a later commit removes
  # it: rotate it at once, as rewriting history does not take it back.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BETTERLEAKS_VERSION: 1.10.0
      BETTERLEAKS_SHA256: 9d9ad503cd5d80d18a939352266c3fcca52f10da9b83cd5cfe646989b13940fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Betterleaks
        run: |
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$archive"
          echo "$BETTERLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" betterleaks
      # --redact keeps whatever it finds out of the public log; the finding's
      # file, line and commit are enough to find it.
      - run: >-
          "$RUNNER_TEMP/betterleaks" git .
          --config .betterleaks.toml
          --confidence medium
          --redact
          --no-banner

  # The SDKs, generated from the contract and committed: a contract change
  # comes with the SDKs it changes, or sdk:check fails. Each SDK then builds
  # in its language's image, pinned by digest, as its registry would get it.
  sdks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DO_NOT_TRACK: "1"
      NX_NO_CLOUD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # Builds the Python SDK.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
      - run: bun install --frozen-lockfile
      - run: bun run sdk:check
      - run: bun run sdk:build
      # Each SDK calls a stand-in API as its users would (scripts/test.ts).
      - run: bun run sdk:test

  # The end-to-end tests: a new member's first steps in Chromium, against the
  # server and the web app's production build, each started by the run on
  # its own database, Mailpit and SeaweedFS. They need no model.
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_DB: peal
          POSTGRES_PASSWORD: peal
          POSTGRES_USER: peal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username peal --dbname peal"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        env:
          MP_SMTP_DISABLE_RDNS: "true"
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DO_NOT_TRACK: "1"
      NX_NO_CLOUD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: docker compose --file packages/peal-docker/compose.yaml up --detach --wait seaweedfs
      # Chromium for the Playwright version @e2e-dev/web pins, with the system
      # libraries it needs.
      - run: ./node_modules/.bin/e2e-web install chromium --with-deps
        working-directory: packages/peal-e2e
      - run: bun nx run peal-e2e:e2e
        env:
          DATABASE_URL: postgres://peal:peal@localhost:5432/peal
          MAILPIT_URL: http://localhost:8025
          SMTP_URL: smtp://localhost:1025
      # The report, a trace page and screenshots for each failed test, and the
      # server's and the web app's output. Every value in them is synthetic.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: packages/peal-e2e/.e2e/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
