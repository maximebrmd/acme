name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The server's tests run against a real, throwaway database, and read the
    # emails they send from Mailpit.
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_DB: acme
          POSTGRES_PASSWORD: acme
          POSTGRES_USER: acme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username acme --dbname acme"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        env:
          MP_SMTP_DISABLE_RDNS: "true"
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DO_NOT_TRACK: "1"
      NX_NO_CLOUD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # The Ansible toolchain in packages/acme-infra, which `bun run test`
      # lints and syntax-checks.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      # The media tests store files in the development stack's S3 store, on
      # the port and synthetic credentials compose.yaml defaults to, and the
      # billing tests call its stripe-mock.
      - run: docker compose --file packages/acme-docker/compose.yaml up --detach --wait seaweedfs stripe-mock
      - run: bun run test
        env:
          DATABASE_URL: postgres://acme:acme@localhost:5432/acme
          MAILPIT_URL: http://localhost:8025
          SMTP_URL: smtp://localhost:1025
      - run: bun run build

  # The end-to-end tests: a new member's first steps in Chromium, against the
  # server and the web app's production build, each started by the run on
  # its own database, Mailpit and SeaweedFS. They need no model.
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_DB: acme
          POSTGRES_PASSWORD: acme
          POSTGRES_USER: acme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username acme --dbname acme"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
        env:
          MP_SMTP_DISABLE_RDNS: "true"
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DO_NOT_TRACK: "1"
      NX_NO_CLOUD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: docker compose --file packages/acme-docker/compose.yaml up --detach --wait seaweedfs
      # Chromium for the Playwright version @e2e-dev/web pins, with the system
      # libraries it needs.
      - run: ./node_modules/.bin/e2e-web install chromium --with-deps
        working-directory: packages/acme-e2e
      - run: bun nx run acme-e2e:e2e
        env:
          DATABASE_URL: postgres://acme:acme@localhost:5432/acme
          MAILPIT_URL: http://localhost:8025
          SMTP_URL: smtp://localhost:1025
      # The report, a trace page and screenshots for each failed test, and the
      # server's and the web app's output. Every value in them is synthetic.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: packages/acme-e2e/.e2e/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
