name: Set up the workspace
description: >-
  Node, the workspace's Bun, uv when asked, and the installed dependencies,
  with Nx's cache from earlier runs when a cache name is given. Runs after
  actions/checkout.

inputs:
  uv:
    description: Whether to install uv, for the Ansible toolchain and the Python SDK.
    default: "false"
  nx-cache:
    description: >-
      A name for this job's Nx cache, restored from this branch's last run
      or the default branch's, and saved when the job succeeds. Empty for none.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.13.0
        package-manager-cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version
    - if: inputs.uv == 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.7
    - run: bun install --frozen-lockfile
      shell: bash
    # Nx hashes every input of a cached target, so an entry restored from an
    # earlier commit is reused only where nothing it reads has changed. Tests
    # are never cached (nx.json).
    - if: inputs.nx-cache != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ inputs.nx-cache }}-${{ github.sha }}
        restore-keys: nx-${{ runner.os }}-${{ inputs.nx-cache }}-
