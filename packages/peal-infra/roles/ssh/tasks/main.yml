---
# authorized_key is exclusive below: a placeholder key would lock everyone
# out, so it is refused first.
- name: Refuse placeholder admin keys
  ansible.builtin.assert:
    that: admin_ssh_public_keys | select('search', 'REPLACE') | list | length == 0
    fail_msg: Put the admins' public keys in admin_ssh_public_keys.
    quiet: true

- name: Create the admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    groups: [sudo]
    append: true
    password_lock: true

# Exclusive: a key removed from the inventory is revoked on the server.
- name: Authorize the admin keys
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_public_keys | join('\n') }}"
    exclusive: true

- name: Let the admin user use sudo without a password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/10-admin
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# Where the image let its own account in rather than root (bootstrap_user),
# that account holds an admin's key and sudo without a password. This role
# runs as the admin user, with sudo, so both work by now: the image's account
# goes, with its home, even if a session of the bootstrap is still open
# (force), and with the sudo rule cloud-init wrote for it. cloud-init makes
# it once per instance, not at each boot; a server made again from a snapshot
# is a new instance, and the next run removes it again.
- name: Remove the account the image came with
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
    force: true
  loop: "{{ ssh_image_users }}"

- name: Remove the sudo rule of the account the image came with
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/90-cloud-init-users
    regexp: '^{{ item | regex_escape }}\s'
    state: absent
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ ssh_image_users }}"

# Lowest-sorted drop-in: sshd keeps the first value it reads for each option.
# Each file is validated before it replaces the live one, then the whole
# configuration, which reports no change.
- name: Allow key-only logins for the admin user
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/000-peal.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Validate the full sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
