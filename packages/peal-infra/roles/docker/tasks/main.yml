---
# Docker Engine and Compose from Docker's repository, at the versions
# docker_packages names: the stack needs Engine 28 or later for image mounts,
# and Compose 2.35 or later.
#
# In check mode, a task that needs what an earlier one would make skips when
# that one reports a change: on a new server, the repository waits for
# python3-debian, apt cannot find Docker's packages before their repository
# is added, and the daemon's folder and service come with the packages.
- name: Create the apt keyrings folder
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# deb822_repository reads and writes sources with it, in check mode too.
- name: Install what Docker's repository needs
  ansible.builtin.apt:
    name: python3-debian
    state: present
  register: docker_python_debian

- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    signed_by: /etc/apt/keyrings/docker.asc
  register: docker_repository
  when: not (ansible_check_mode and docker_python_debian is changed)

# Docker builds each version for each release of Ubuntu, and says which in
# the version's suffix.
- name: Name the versions for the server's release
  ansible.builtin.set_fact:
    docker_release_suffix: "~ubuntu.{{ ansible_facts.distribution_version }}~{{ ansible_facts.distribution_release }}"

# Above 1000, the pinned version is the one apt installs, upgrades to and
# goes back to, whatever newer one the repository has.
- name: Hold Docker's packages at their versions
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/docker
    content: |
      # Managed by Ansible (peal-infra): Docker's packages stay at these
      # versions (docker_packages).
      {% for name, version in docker_packages | dictsort %}

      Package: {{ name }}
      Pin: version {{ version }}{{ docker_release_suffix }}
      Pin-Priority: 1001
      {% endfor %}
    mode: "0644"

- name: Look for Docker Engine
  ansible.builtin.stat:
    path: /usr/bin/dockerd
  register: docker_engine

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name: "{{ docker_packages.items() | map('join', '=') | map('regex_replace', '$', docker_release_suffix) | list }}"
    state: present
    update_cache: true
    allow_downgrade: true
  when: not (ansible_check_mode and (docker_repository is changed or docker_repository is skipped))

- name: Configure the Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon | to_nice_json }}\n"
    mode: "0644"
  when: not ansible_check_mode or docker_engine.stat.exists
  notify: Restart Docker

- name: Start Docker at boot
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  when: not ansible_check_mode or docker_engine.stat.exists
