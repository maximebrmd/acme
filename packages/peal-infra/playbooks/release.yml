---
# Deploy a version of Peal, one server at a time. Run after site.yml:
#   ansible-playbook playbooks/release.yml --limit sandbox
#   ansible-playbook playbooks/release.yml --limit production -e peal_version=<ref>
- name: Release Peal
  hosts: servers
  become: true
  serial: 1
  roles:
    - peal_preflight
    - peal_release
