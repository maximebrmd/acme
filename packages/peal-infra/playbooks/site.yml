---
# The servers' baseline and Peal's runtime. Run after bootstrap.yml, as the
# admin user, and again whenever this folder changes; a second run reports
# no change:
#   ansible-playbook playbooks/site.yml --limit production --check --diff
#   ansible-playbook playbooks/site.yml --limit production --diff
# The firewall comes after cloudflared, so the tunnel carries SSH before
# port 22 closes.
- name: Configure the servers
  hosts: servers
  become: true
  roles:
    - peal_preflight
    - system
    - ssh
    - docker
    - cloudflared
    - firewall
    - peal_runtime
    - peal_backup
