---
# Run once on a new server, as root over its public address, before
# anything else:
#   ansible-playbook playbooks/bootstrap.yml --limit production -e ansible_user=root -e ssh_via_tunnel=false
#   ansible-playbook playbooks/bootstrap.yml --limit uptime -e ansible_user=root
# It creates the admin account every other playbook logs in with; site.yml,
# or uptime.yml, then turns root logins off.
- name: Create the admin account
  hosts: servers:uptime
  gather_facts: false
  roles:
    - peal_preflight
  tasks:
    # Locked password: the account logs in with keys only.
    - name: Create the admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: [sudo]
        append: true
        password_lock: true

    - name: Authorize the admin keys
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ admin_ssh_public_keys | join('\n') }}"
        exclusive: true

    # Ansible needs sudo without a password; the account has none to type.
    - name: Let the admin user use sudo without a password
      ansible.builtin.copy:
        dest: /etc/sudoers.d/10-admin
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
