---
# The sandbox: pre-production, with its own database, buckets and platform
# redirect URIs, behind Cloudflare Access throughout. The host names are the official
# ones; the other values are placeholders until the Cloudflare account and
# the server exist.
server_hostname: peal-sandbox
peal_environment: sandbox

# Where it is hosted (group_vars/production says how to write them). The
# sandbox may share production's provider and city: it does not watch it.
hosting_provider: REPLACE-WITH-THE-PROVIDER-OF-THE-SANDBOX
hosting_location: REPLACE-WITH-THE-CITY-OF-THE-SANDBOX

# First-level subdomains only: Cloudflare's free certificate covers no
# deeper name, such as app.sandbox.peal.social.
peal_hostnames:
  app: sandbox.peal.social
  site: sandbox-site.peal.social
  docs: sandbox-docs.peal.social
  grafana: sandbox-grafana.peal.social
  ssh: sandbox-ssh.peal.social

cloudflare_access_team: winter-resonance-b4ec
cloudflare_access_aud:
  # One application covers the sandbox's app, site and docs.
  sandbox: 3823cf7d18f15fc04895ec62c1ebf12aae817877bfa133535a051451507430f6
  grafana: 061dcc5b23aa4a756b31697aa95ee39677939c09e16852145f00dfd84906c8e1
  ssh: 115b57932dbf918138cca334366d4f6dea680cbbafbdc19b63e0875d4fa1aef9
peal_access_everything: true

peal_mail_from: Peal Sandbox <notifications@peal.social>

peal_media_endpoint: https://6fdd7e600b33c2c948da88b6cf8b5f26.eu.r2.cloudflarestorage.com
peal_media_bucket: peal-sandbox-media
peal_backup_endpoint: 6fdd7e600b33c2c948da88b6cf8b5f26.eu.r2.cloudflarestorage.com
peal_backup_bucket: peal-sandbox-backups
peal_backup_path: /sandbox

# Few people use the sandbox: the server traces every request there.
peal_settings:
  OTEL_TRACES_SAMPLER: parentbased_always_on

peal_static_build_args:
  SITE_URL: https://sandbox-site.peal.social
  SITE_APP_URL: https://sandbox.peal.social
  SITE_DOCS_URL: https://sandbox-docs.peal.social
  DOCS_SITE_URL: https://sandbox-docs.peal.social
