---
# The credentials outside services issue, for one environment. Copy this file
# to group_vars/<environment>/vault.yml (Git ignores it), fill it in, and
# encrypt it: `uv run ansible-vault encrypt group_vars/production/vault.yml`.
# Or leave the vault out and write the same values on the server (README.md).
# Values shown are placeholders.

# The tunnel's token: `cloudflared tunnel token <tunnel name>` on your own
# machine, for a tunnel created with `cloudflared tunnel create`.
cloudflared_tunnel_token: REPLACE

# Written to /srv/peal/credentials.env as NAME='value'. A single quote cannot
# appear in a value.
peal_credentials:
  # An R2 API token with Object Read & Write on the media bucket only.
  PEAL_S3_ACCESS_KEY_ID: REPLACE
  PEAL_S3_SECRET_ACCESS_KEY: REPLACE
  # An R2 API token with Object Read & Write on the backup bucket only.
  PGBACKREST_REPO1_S3_KEY: REPLACE
  PGBACKREST_REPO1_S3_KEY_SECRET: REPLACE
  # Encrypts the backups: `openssl rand -base64 48`. Keep a copy outside the
  # server, such as in a password manager: a restore needs it, and the
  # backups cannot be read without it.
  PGBACKREST_REPO1_CIPHER_PASS: REPLACE
  # Email through Resend, or SMTP_URL.
  RESEND_API_KEY: REPLACE
  # The alert bot (from @BotFather) and the chat it writes to.
  TELEGRAM_BOT_TOKEN: REPLACE
  TELEGRAM_CHAT_ID: REPLACE
  # Where peal_heartbeat_url is set (production): the token Grafana's
  # heartbeat carries, which the uptime server generated, from its
  # /srv/uptime/secrets.env (PRODUCTION_HEARTBEAT_TOKEN; README.md, "Uptime").
  PEAL_HEARTBEAT_TOKEN: REPLACE
  # Optional, each turning a feature on (the docs' environment variables
  # page): the writing assistant's provider key; Stripe's, with
  # STRIPE_LOOKUP_KEY_PREFIX in peal_settings when its prices' lookup keys
  # do not start with peal; Turnstile's secret, with
  # TURNSTILE_SITE_KEY there; and the secrets of the platforms' apps, with
  # their ids there
  # (LINKEDIN_CLIENT_ID, X_CLIENT_ID, META_APP_ID, INSTAGRAM_APP_ID,
  # THREADS_APP_ID, TIKTOK_CLIENT_KEY, YOUTUBE_CLIENT_ID). Use the sandbox's
  # Stripe account
  # and apps in the sandbox's vault.
  # PEAL_AI_API_KEY: REPLACE
  # STRIPE_SECRET_KEY: REPLACE
  # STRIPE_WEBHOOK_SECRET: REPLACE
  # TURNSTILE_SECRET_KEY: REPLACE
  # LINKEDIN_CLIENT_SECRET: REPLACE
  # X_CLIENT_SECRET: REPLACE
  # META_APP_SECRET: REPLACE
  # INSTAGRAM_APP_SECRET: REPLACE
  # THREADS_APP_SECRET: REPLACE
  # TIKTOK_CLIENT_SECRET: REPLACE
  # YOUTUBE_CLIENT_SECRET: REPLACE
