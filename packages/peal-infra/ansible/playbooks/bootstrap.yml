---
# Run once on a new server, over its public address, before anything else:
#   ansible-playbook playbooks/bootstrap.yml --limit production -e ssh_via_tunnel=false
#   ansible-playbook playbooks/bootstrap.yml --limit uptime
# It logs in as bootstrap_user, the account the server's image lets in with
# your key: root, or the image's own account (ubuntu…), which then uses
# sudo. It creates the admin account every other playbook logs in with;
# site.yml, or uptime.yml, then turns root logins off and removes the
# image's own account.
- name: Create the admin account
  hosts: servers:uptime
  gather_facts: false
  # Above the inventory's ansible_user, the admin user, which does not exist
  # yet; `-e ansible_user=root` still names it.
  vars:
    ansible_user: "{{ bootstrap_user }}"
  become: "{{ ansible_user != 'root' }}"
  roles:
    - peal_preflight
  tasks:
    # A shared host's admin account is the owner's, with keys and a sudo
    # rule that the host's other sites rely on, which the tasks below would
    # replace: uptime.yml runs there as that account, with no bootstrap.
    - name: Refuse to bootstrap a shared host
      ansible.builtin.assert:
        that: not (uptime_shared_host | default(false) | bool)
        fail_msg: >-
          {{ inventory_hostname }} is a shared host (uptime_shared_host): it
          keeps its own admin account; run uptime.yml on it alone.
        quiet: true

    # Locked password: the account logs in with keys only.
    - name: Create the admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: [sudo]
        append: true
        password_lock: true
      register: bootstrap_admin_user

    # In check mode on a new server the user is not made yet, and the keys
    # have no home to go to.
    - name: Authorize the admin keys
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ admin_ssh_public_keys | join('\n') }}"
        exclusive: true
      when: not (ansible_check_mode and bootstrap_admin_user.changed)

    # Ansible needs sudo without a password; the account has none to type.
    - name: Let the admin user use sudo without a password
      ansible.builtin.copy:
        dest: /etc/sudoers.d/10-admin
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
