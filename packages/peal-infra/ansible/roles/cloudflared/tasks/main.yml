---
# cloudflared connects out to Cloudflare and carries every request in through
# the tunnel, so the server opens no inbound port. It runs a locally managed
# tunnel: its routes are config.yml below, and its token comes from the vault
# or was written on the server (README.md).
#
# In check mode, a task that needs what an earlier one would make skips when
# that one reports a change: on a new server, neither the download folder,
# the package, the configuration folder nor the service exists yet.
- name: Create the cloudflared user
  ansible.builtin.user:
    name: cloudflared
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Name the package for the server's architecture
  ansible.builtin.set_fact:
    cloudflared_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"

- name: Create the download folder
  ansible.builtin.file:
    path: /var/cache/cloudflared
    state: directory
    mode: "0755"
  register: cloudflared_cache

# Skipped once the file is there with this digest.
- name: Download cloudflared
  ansible.builtin.get_url:
    url: https://github.com/cloudflare/cloudflared/releases/download/{{ cloudflared_version }}/cloudflared-linux-{{ cloudflared_arch }}.deb
    dest: /var/cache/cloudflared/cloudflared-{{ cloudflared_version }}-{{ cloudflared_arch }}.deb
    checksum: sha256:{{ cloudflared_deb_sha256[cloudflared_arch] }}
    mode: "0644"
  register: cloudflared_download
  when: not (ansible_check_mode and cloudflared_cache is changed)

# Unchanged when this version is installed already.
- name: Install cloudflared
  ansible.builtin.apt:
    deb: /var/cache/cloudflared/cloudflared-{{ cloudflared_version }}-{{ cloudflared_arch }}.deb
  when: not (ansible_check_mode and (cloudflared_download is changed or cloudflared_download is skipped))
  notify: Restart cloudflared

- name: Create the configuration folder
  ansible.builtin.file:
    path: "{{ cloudflared_config_dir }}"
    state: directory
    owner: root
    group: cloudflared
    mode: "0750"
  register: cloudflared_folder

- name: Write the tunnel token from the vault
  ansible.builtin.copy:
    dest: "{{ cloudflared_config_dir }}/token"
    content: "{{ cloudflared_tunnel_token }}\n"
    owner: root
    group: cloudflared
    mode: "0440"
  when: >-
    cloudflared_tunnel_token is defined
    and not (ansible_check_mode and cloudflared_folder is changed)
  no_log: true
  notify: Restart cloudflared

- name: Check for the tunnel token
  ansible.builtin.stat:
    path: "{{ cloudflared_config_dir }}/token"
  register: cloudflared_token

- name: Require the tunnel token
  ansible.builtin.assert:
    that: cloudflared_tunnel_token is defined or cloudflared_token.stat.exists
    fail_msg: >-
      Put the tunnel's token in the vault (cloudflared_tunnel_token), or write it to
      {{ cloudflared_config_dir }}/token on the server (README.md, "Credentials").
    quiet: true

- name: Write the tunnel's routes
  ansible.builtin.import_tasks: routes.yml

- name: Look for the cloudflared service
  ansible.builtin.stat:
    path: /etc/systemd/system/cloudflared.service
  register: cloudflared_unit

- name: Write the cloudflared service
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    mode: "0644"
  notify: Restart cloudflared

- name: Start cloudflared at boot
  ansible.builtin.systemd_service:
    name: cloudflared
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode or cloudflared_unit.stat.exists

- name: Apply a changed configuration now
  ansible.builtin.meta: flush_handlers

# Read-only: answers 200 once cloudflared holds connections to Cloudflare.
- name: Wait until the tunnel is connected
  ansible.builtin.uri:
    url: http://{{ cloudflared_metrics }}/ready
  register: cloudflared_ready
  until: cloudflared_ready.status == 200
  retries: 20
  delay: 3
  when: not ansible_check_mode
