---
- name: Set the host name
  ansible.builtin.hostname:
    name: "{{ server_hostname }}"

- name: Resolve the host name locally
  ansible.builtin.lineinfile:
    path: "{{ system_hosts_file }}"
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ server_hostname }}"

# Some providers' images have cloud-init manage the hosts file
# (manage_etc_hosts): at every boot it writes the file again from its
# template, with the name the provider gave the server, and the line above
# would last until the next reboot. Two guards, as the setting comes from
# the image's own files or from what the provider sends at boot, which
# cloud-init reads after any file here:
#
# - a settings file read after the image's own turns it off, and tells
#   cloud-init to leave the host name alone too;
# - cloud-init's template holds the same line, so a boot that still writes
#   the hosts file writes it there.
#
# An image without cloud-init has neither folder, and both are skipped.
- name: Look for cloud-init
  ansible.builtin.stat:
    path: "{{ system_cloud_init_dir }}/cloud.cfg.d"
  register: system_cloud_init

- name: Keep cloud-init from rewriting the hosts file
  ansible.builtin.copy:
    dest: "{{ system_cloud_init_dir }}/cloud.cfg.d/zz-peal.cfg"
    content: |
      # Managed by Ansible (peal-infra). The hosts file and the host name
      # are the system role's: cloud-init leaves them as they are at boot.
      manage_etc_hosts: false
      preserve_hostname: true
    mode: "0644"
  when: system_cloud_init.stat.exists

- name: Look for cloud-init's hosts template
  ansible.builtin.stat:
    path: "{{ system_cloud_init_dir }}/templates/hosts.debian.tmpl"
  register: system_hosts_template

- name: Resolve the host name in cloud-init's hosts template
  ansible.builtin.lineinfile:
    path: "{{ system_cloud_init_dir }}/templates/hosts.debian.tmpl"
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ server_hostname }}"
  when: system_hosts_template.stat.exists

- name: Use UTC
  community.general.timezone:
    name: Etc/UTC

# A second run within the hour reads the cached lists and upgrades nothing.
- name: Upgrade installed packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Install base packages
  ansible.builtin.apt:
    name: [unattended-upgrades, ufw, ca-certificates, curl]
    state: present

# Security updates install daily. A kernel update needs a reboot, which
# happens at a fixed early-morning time instead of never. Docker restarts the
# stack after it (restart: unless-stopped).
- name: Configure unattended upgrades
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"

- name: Enable the daily apt timers
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    mode: "0644"

# Swap absorbs a memory spike, such as many images probed at once, instead
# of the kernel killing a process (videos are streamed to the platforms, a
# few at a time: PEAL_MAX_CONCURRENT_UPLOADS). The file is swap_file, which
# may be one the image made. It is made under another name and renamed once
# it is a swap area, so a run cut short leaves no swap file half made;
# `creates` skips it once the file exists, whatever its size, and check mode
# says it would run.
- name: Create the swap file
  ansible.builtin.shell: |
    set -eu
    umask 077
    rm -f {{ swap_file }}.new
    fallocate -l {{ swap_size_mb }}M {{ swap_file }}.new
    mkswap {{ swap_file }}.new
    mv {{ swap_file }}.new {{ swap_file }}
  args:
    creates: "{{ swap_file }}"

# Read-only, so it runs in check mode too.
- name: Read the active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: system_swap_active
  changed_when: false
  check_mode: false

- name: Turn the swap on
  ansible.builtin.command: swapon {{ swap_file }}
  when: swap_file not in system_swap_active.stdout_lines
  changed_when: true

# Found by its file: an image's own line for it is the same, and stays.
- name: Mount the swap at boot
  ansible.posix.mount:
    src: "{{ swap_file }}"
    path: none
    fstype: swap
    opts: sw
    state: present

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_file: /etc/sysctl.d/60-swap.conf

# Ubuntu ships no drop-in folder for journald. In check mode on a new
# server, the file waits for it.
- name: Create journald's drop-in folder
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"
  register: system_journald_folder

- name: Cap the journal size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/50-size.conf
    content: |
      [Journal]
      SystemMaxUse=500M
    mode: "0644"
  when: not (ansible_check_mode and system_journald_folder is changed)
  notify: Restart journald
