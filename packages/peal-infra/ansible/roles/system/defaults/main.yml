---
# Where the server keeps its hosts file and cloud-init's settings. The tests
# name a folder of their own (tests/test_cloud_init.py).
system_hosts_file: /etc/hosts
system_cloud_init_dir: /etc/cloud

# Units the server's image runs that nothing here needs, stopped and masked
# so that nothing starts them again: by hand, at boot, or a socket, timer,
# path or D-Bus request. Each with its suffix (.service, .socket, .timer,
# .path); a unit the server does not have is skipped. Masked rather than
# removed: removing their packages can take Ubuntu's metapackages with them,
# whose other dependencies the unattended upgrades would then remove.
system_masked_units: []
# Where systemd reads units from: their packages', then the administrator's.
# The tests name folders of their own (tests/test_units.py).
system_unit_folders: [/usr/lib/systemd/system, /etc/systemd/system]

# What peal-reboot reads and runs: where the md arrays are, the file an
# update leaves when it needs a reboot, and the reboot. The tests name
# their own (tests/test_reboot.py).
system_sys_block: /sys/block
system_reboot_required_file: /var/run/reboot-required
system_reboot_command: /usr/bin/systemctl reboot
