---
# In check mode on a new server, the files that go in peal_root wait for the
# folder: the tasks that write them skip until it exists.
- name: Look for the Peal folder
  ansible.builtin.stat:
    path: "{{ peal_root }}"
  register: peal_runtime_root

- name: Create the Peal folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ peal_root }}"
    - "{{ peal_root }}/releases"
    - "{{ peal_root }}/images"

# Generated once on the server and never copied anywhere else, but to the
# server that replaces it in a planned move (runbooks/restore-database.md):
# `creates` skips the task once the file exists. The token key id carries
# the date and random characters, so a server rebuilt from a backup, even on
# the day the old one was set up, never reads tokens with a new key under an
# old key's name: they fail as encrypted with a key it does not have.
- name: Generate the secrets
  ansible.builtin.shell: |
    set -eu
    umask 077
    {
      printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)"
      printf 'BETTER_AUTH_SECRET=%s\n' "$(openssl rand -base64 32)"
      printf 'PEAL_TOKEN_KEYS=k%s-%s:%s\n' "$(date -u +%Y%m%d)" "$(openssl rand -hex 4)" "$(openssl rand -base64 32)"
      printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 24)"
    } > {{ peal_root }}/secrets.env.new
    mv {{ peal_root }}/secrets.env.new {{ peal_root }}/secrets.env
  args:
    creates: "{{ peal_root }}/secrets.env"

# Credentials that outside services issued: from the vault when it holds
# them, otherwise written on the server by hand (README.md).
- name: Refuse credentials Compose would misread
  ansible.builtin.assert:
    that: peal_credentials.values() | map('string') | select('search', "['\r\n]") | list | length == 0
    fail_msg: A credential holds a single quote or a line break, which credentials.env cannot.
    quiet: true
  when: peal_credentials is defined

- name: Write the credentials from the vault
  ansible.builtin.template:
    src: credentials.env.j2
    dest: "{{ peal_root }}/credentials.env"
    owner: root
    group: root
    mode: "0600"
  when: >-
    peal_credentials is defined
    and (not ansible_check_mode or peal_runtime_root.stat.exists)
  no_log: true

- name: Check for the credentials
  ansible.builtin.stat:
    path: "{{ peal_root }}/credentials.env"
  register: peal_runtime_credentials

- name: Require the credentials file
  ansible.builtin.assert:
    that: peal_credentials is defined or peal_runtime_credentials.stat.exists
    fail_msg: >-
      Put the credentials in the vault (peal_credentials), or write
      {{ peal_root }}/credentials.env on the server (README.md, "Credentials").
    quiet: true

# Names only: the values never leave the file. Read-only, so it runs in check
# mode too. A value counts once it holds a character, quoted or not: as in
# the vault, NAME= and NAME='' leave it unset.
- name: Find the credentials not set on the server
  ansible.builtin.shell: |
    set -eu
    value="=['\"]?[^'\"[:space:]]"
    for name in {{ peal_runtime_required_credentials | join(' ') }}; do
      grep -Eq "^${name}${value}" {{ peal_root }}/credentials.env || echo "$name"
    done
    grep -Eq "^({{ peal_mail_credentials | join('|') }})${value}" {{ peal_root }}/credentials.env ||
      echo '{{ peal_mail_credentials | join(' or ') }}'
  register: peal_runtime_unset
  changed_when: false
  check_mode: false
  when: peal_credentials is not defined

- name: Require every credential
  ansible.builtin.assert:
    that: peal_runtime_missing | length == 0
    fail_msg: "Set {{ peal_runtime_missing | join(', ') }} in the credentials."
    quiet: true
  vars:
    peal_runtime_missing: >-
      {{ (peal_runtime_required_credentials | difference(peal_runtime_vault_set)
          + ([] if peal_runtime_vault_set | intersect(peal_mail_credentials) else [peal_mail_credentials | join(' or ')]))
         if peal_credentials is defined else peal_runtime_unset.stdout_lines }}
    # The names the vault gives a value to, as the check on the server reads
    # them.
    peal_runtime_vault_set: >-
      {{ peal_credentials | default({}) | dict2items
         | rejectattr('value', 'equalto', '') | rejectattr('value', 'none')
         | map(attribute='key') | list }}

# The optional ones, by name as above: Slack's webhook picks Grafana's
# contact points (peal_runtime_slack_alerts), and its absence stops nothing.
- name: Find the optional credentials set on the server
  ansible.builtin.shell: |
    set -eu
    value="=['\"]?[^'\"[:space:]]"
    for name in {{ peal_runtime_optional_credentials | join(' ') }}; do
      if grep -Eqs "^${name}${value}" {{ peal_root }}/credentials.env; then
        echo "$name"
      fi
    done
  register: peal_runtime_optional_set
  changed_when: false
  check_mode: false
  when: peal_credentials is not defined

# The media bucket and the backup repository are any S3 API's, in the EU.
# The server reads the media endpoint as an HTTPS URL, and pgBackRest the
# backup endpoint as a host, without a scheme. On Cloudflare R2, a bucket
# made in the EU jurisdiction, which cannot change afterwards, answers at
# <account>.eu.r2.cloudflarestorage.com alone: the account's plain endpoint
# would name buckets stored anywhere, and never find these. Nothing in
# another store's endpoint says where its buckets are: the inventory names
# the hosts the owner checked (peal_storage_eu_hosts). Hosts are compared
# without their case or a port.
- name: Refuse storage endpoints the stack would misread, or outside the EU
  ansible.builtin.assert:
    that: peal_runtime_misplaced | length == 0
    fail_msg: >-
      Change {{ peal_runtime_misplaced | join(', ') }}: the media endpoint is
      an https:// URL, the backup endpoint a host without a scheme, an R2
      endpoint is the EU jurisdiction's, <account>.eu.r2.cloudflarestorage.com,
      and another store's host is listed in peal_storage_eu_hosts once its
      buckets are known to be in the EU (README.md, "Object storage").
    quiet: true
  vars:
    peal_runtime_r2: '(^|\.)r2\.cloudflarestorage\.com$'
    peal_runtime_r2_eu: '\.eu\.r2\.cloudflarestorage\.com$'
    peal_runtime_eu_hosts: "{{ peal_storage_eu_hosts | map('lower') | list }}"
    peal_runtime_media_host: "{{ peal_media_endpoint | lower | regex_replace('^https://', '') | regex_replace('[:/].*$', '') }}"
    peal_runtime_backup_host: "{{ peal_backup_endpoint | lower | regex_replace('[:/].*$', '') }}"
    peal_runtime_media_in_eu: >-
      {{ peal_runtime_media_host is search(peal_runtime_r2_eu)
         or (peal_runtime_media_host is not search(peal_runtime_r2) and peal_runtime_media_host in peal_runtime_eu_hosts) }}
    peal_runtime_backup_in_eu: >-
      {{ peal_runtime_backup_host is search(peal_runtime_r2_eu)
         or (peal_runtime_backup_host is not search(peal_runtime_r2) and peal_runtime_backup_host in peal_runtime_eu_hosts) }}
    peal_runtime_misplaced: >-
      {{ (['peal_media_endpoint']
          if peal_media_endpoint is not match('https://') or not (peal_runtime_media_in_eu | bool)
          else [])
         + (['peal_backup_endpoint']
            if peal_backup_endpoint is search('://') or not (peal_runtime_backup_in_eu | bool)
            else []) }}

# host.env holds NAME='value' lines, which Compose reads as they are: a
# quote or a line break in a value would end it early, and the rest would be
# read as more settings, or lost.
- name: Refuse host settings Compose would misread
  ansible.builtin.assert:
    that: peal_runtime_misread | length == 0
    fail_msg: >-
      Change {{ peal_runtime_misread | join(', ') }}: host.env takes names of
      letters, digits and underscores, and values that are a string or a
      number without a single quote or a line break.
    quiet: true
  vars:
    peal_runtime_misread: >-
      {{ (peal_runtime_host_settings | dict2items
          | rejectattr('key', 'match', '^[A-Za-z_][A-Za-z0-9_]*\Z') | map(attribute='key') | list)
         + (peal_runtime_host_settings | dict2items
            | rejectattr('value', 'string') | rejectattr('value', 'number') | map(attribute='key') | list)
         + (peal_runtime_host_settings | dict2items | selectattr('value', 'string')
            | selectattr('value', 'search', "['\r\n]") | map(attribute='key') | list) }}

# A public media bucket serves every object to whoever knows its key: the
# erasure ledger then needs a bucket of its own, which the media bucket
# named again is not.
- name: Refuse a public media bucket that holds the erasure ledger
  ansible.builtin.assert:
    that: not peal_runtime_ledger_exposed
    fail_msg: >-
      PEAL_MEDIA_PUBLIC_BASE_URL serves the media bucket publicly: name a
      private bucket for the erasure ledger with peal_erasure_ledger_bucket,
      another than the media bucket.
    quiet: true
  vars:
    peal_runtime_ledger_exposed: >-
      {{ (peal_runtime_host_settings.PEAL_MEDIA_PUBLIC_BASE_URL | default('') | string | length > 0)
         and ((peal_runtime_host_settings.PEAL_ERASURE_LEDGER_BUCKET | default('') | string | length == 0)
              or (peal_runtime_host_settings.PEAL_ERASURE_LEDGER_BUCKET | string
                  == peal_runtime_host_settings.PEAL_S3_BUCKET | default('') | string)) }}

# Mounted read-only in the server, which runs without privileges: readable
# by all, as it holds what the privacy policy publishes anyway. The server
# reads it when it starts, so a change restarts it.
- name: Write the privacy declaration
  ansible.builtin.copy:
    content: "{{ peal_privacy_declaration | to_nice_json }}\n"
    dest: "{{ peal_root }}/privacy-declaration.json"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode or peal_runtime_root.stat.exists
  notify: Restart the server with the new privacy declaration

- name: Write the host settings for Compose
  ansible.builtin.template:
    src: host.env.j2
    dest: "{{ peal_root }}/host.env"
    owner: root
    group: root
    mode: "0640"
  when: not ansible_check_mode or peal_runtime_root.stat.exists

# `sudo peal-compose ps`, `logs server`, `exec postgres psql --username peal`:
# Compose on the release that runs, with its settings.
- name: Install peal-compose
  ansible.builtin.template:
    src: peal-compose.j2
    dest: "{{ peal_compose_bin }}"
    owner: root
    group: root
    mode: "0755"
