---
# The plain settings host.env gives compose.production.yaml, by name: the
# inventory's, then peal_settings, which may replace them. Secrets are in
# secrets.env (generated on the server) and credentials.env (issued by
# outside services), beside it.
peal_runtime_host_settings: >-
  {{ {
       'PUBLIC_URL': 'https://' ~ peal_hostnames.app,
       'PEAL_TERMS_URL': 'https://' ~ peal_hostnames.site ~ '/terms/',
       'PEAL_PRIVACY_URL': 'https://' ~ peal_hostnames.site ~ '/privacy/',
       'PEAL_DOCS_URL': 'https://' ~ peal_hostnames.docs,
       'AUTH_IP_HEADERS': 'cf-connecting-ip',
       'MAIL_FROM': peal_mail_from,
       'PEAL_LEGAL_RETENTION': peal_legal_retention,
       'PEAL_PRIVACY_DECLARATION': peal_root ~ '/privacy-declaration.json',
       'PEAL_S3_ENDPOINT': peal_media_endpoint,
       'PEAL_S3_BUCKET': peal_media_bucket,
       'PEAL_POSTGRES_ARCHIVE_MODE': 'on',
       'PGBACKREST_REPO1_S3_ENDPOINT': peal_backup_endpoint,
       'PGBACKREST_REPO1_S3_BUCKET': peal_backup_bucket,
       'PGBACKREST_REPO1_PATH': peal_backup_path,
       'PEAL_GRAFANA_URL': 'https://' ~ peal_hostnames.grafana,
       'PEAL_GRAFANA_ACCESS_TEAM': cloudflare_access_team,
       'PEAL_GRAFANA_ACCESS_AUD': cloudflare_access_aud.grafana,
       'PEAL_GRAFANA_CONTACT_POINTS': './config/production/grafana/alerting/'
                                      ~ ('telegram-slack.yaml' if peal_runtime_slack_alerts | bool else 'telegram.yaml'),
       'PEAL_GRAFANA_ENVIRONMENT': peal_environment,
       'PEAL_SERVER_PORT': peal_ports.server,
       'PEAL_WEB_PORT': peal_ports.web,
       'PEAL_SITE_PORT': peal_ports.site,
       'PEAL_DOCS_PORT': peal_ports.docs,
       'PEAL_DOCS_SERVER_PORT': peal_ports.docs_server,
       'PEAL_GRAFANA_PORT': peal_ports.grafana,
       'PEAL_OTLP_HTTP_PORT': peal_ports.otlp_http,
     }
     | combine({'PEAL_SHORT_LINK_BASE': 'https://' ~ peal_short_link_hostname ~ '/'}
               if peal_short_link_hostname else {})
     | combine({'PEAL_ERASURE_LEDGER_BUCKET': peal_erasure_ledger_bucket}
               if peal_erasure_ledger_bucket else {})
     | combine({
         'PEAL_GRAFANA_HEARTBEAT': './config/production/grafana/alerting/heartbeat.yaml',
         'PEAL_HEARTBEAT_URL': peal_heartbeat_url,
       } if peal_heartbeat_url else {})
     | combine(peal_settings) }}

# Grafana alerts Slack too, beside Telegram, once the environment's Slack
# webhook (SLACK_ALERTS_WEBHOOK_URL, to #alerts-production or
# #alerts-sandbox) is among its credentials: in the vault, or found by name
# in credentials.env on the server. Grafana refuses to start on a contact
# point whose setting is missing, so the file follows the credentials.
peal_runtime_optional_credentials: [SLACK_ALERTS_WEBHOOK_URL]
peal_runtime_slack_alerts: >-
  {{ 'SLACK_ALERTS_WEBHOOK_URL'
     in ((peal_credentials | dict2items | rejectattr('value', 'equalto', '') | rejectattr('value', 'none')
          | map(attribute='key') | list)
         if peal_credentials is defined
         else (peal_runtime_optional_set.stdout_lines | default([]))) }}

# The credentials this server needs, by name: peal_required_credentials, the
# heartbeat's token when Grafana sends one, and the docs' assistant's key
# when the docs run as a server.
peal_runtime_required_credentials: >-
  {{ peal_required_credentials
     + (['PEAL_HEARTBEAT_TOKEN'] if peal_heartbeat_url else [])
     + (['DOCS_ANTHROPIC_API_KEY'] if peal_docs_server | bool else []) }}
