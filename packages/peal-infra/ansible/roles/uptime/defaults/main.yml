---
# Where the uptime stack lives on its server, run as the Compose project
# uptime (`sudo uptime-compose ps`).
uptime_root: /srv/uptime
uptime_compose_bin: /usr/local/bin/uptime-compose

# Gatus checks, Caddy is the one public entry. Each is pinned by digest, at
# the Caddy that compose.self-host.yaml runs.
uptime_gatus_image: twinproduction/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
uptime_caddy_image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee

# Gatus's dashboard, on 127.0.0.1 only: `ssh -N -L 8080:127.0.0.1:8080 ops@<uptime_hostname>`.
uptime_gatus_port: 8080

# A server of its own (false), whose stack runs Caddy on port 443, or a host
# the owner already uses for other sites (true; group_vars/uptime), whose
# own Caddy serves the uptime names: Gatus, and the status page's Gatus on
# uptime_status_port, then publish on 127.0.0.1 alone, on ports nothing
# else holds there (README.md, "On a shared host").
uptime_shared_host: false
uptime_status_port: 8081

# The shared host's Caddy, a systemd service whose configuration imports the
# site file (`import /etc/caddy/sites/*.caddy`): the role drops that file
# in, checks the whole configuration as the service's user, and reloads the
# service through its admin API, which listens on uptime_caddy_admin.
uptime_caddy_bin: caddy
uptime_caddy_config: /etc/caddy/Caddyfile
uptime_caddy_site_file: /etc/caddy/sites/peal-uptime.caddy
uptime_caddy_user: caddy
uptime_caddy_service: caddy.service
uptime_caddy_admin: http://127.0.0.1:2019

# What each environment of uptime_environments is checked for, every
# uptime_check_interval: the status a request answers, and how fast, in
# milliseconds, through Cloudflare as people reach it. A redirect is a
# failure, so a page that sends visitors to Cloudflare Access's sign-in never
# passes for the page itself.
uptime_checks:
  - name: site
    host: site
    path: /
    status: 200
    max_ms: 1000
  - name: docs
    host: docs
    path: /
    status: 200
    max_ms: 1000
  - name: web app
    host: app
    path: /sign-in
    status: 200
    max_ms: 2000
  # Readiness: the server answers and its database too.
  - name: api
    host: app
    path: /api/ready
    status: 204
    max_ms: 1000
  # Short links: a code no link has goes through the edge's rewrite to
  # /api/l/<code> and the tunnel, and the server answers its own 404, whose
  # error code (body_code) nothing before it gives: cloudflared's 404, for a
  # path the rewrite missed, has no body. It counts no visit.
  - name: short links
    host: short_links
    path: /0000000
    status: 404
    body_code: not_found
    max_ms: 1000
uptime_check_interval: 1m

# Each host name's certificate, checked hourly, must be valid for this long.
uptime_certificate_hours: 336

# Each host name must resolve through a public resolver outside Cloudflare,
# which serves the zone.
uptime_dns_resolver: 9.9.9.9
uptime_dns_interval: 5m

# A heartbeat that goes this long without news alerts. Grafana sends one
# every 5 minutes or so, so two may go missing first.
uptime_heartbeat_interval: 15m

# Telegram hears of a check after this many failures in a row, and that it
# passes again after this many successes.
uptime_failure_threshold: 3
uptime_success_threshold: 2
