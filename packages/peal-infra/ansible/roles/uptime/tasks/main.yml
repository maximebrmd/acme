---
# Gatus checks the public endpoints of the environments uptime_environments
# lists, from outside, and alerts on Telegram, and on Slack too once its
# webhooks are set; Caddy takes the heartbeats their Grafana sends. The
# platform watch, at the end, posts the platforms' changelog changes to
# Slack. The server shares nothing with them: its credentials
# are its own, from its vault or written on it, and the heartbeat tokens are
# generated here, then given to each environment as one of its credentials
# (README.md, "Uptime").
#
# In check mode on a new server, the files that go in uptime_root wait for the
# folder: the tasks that write them skip until it exists.
# The uptime server alerts when the others cannot, so it is hosted apart from
# them: at another provider (another network, console and account, which a
# suspension or an outage takes whole) and in another city (another power
# supply and other upstream networks). A server whose hosting is still a
# placeholder counts as shared: nothing tells it apart yet.
- name: Refuse an uptime server hosted with a server it watches
  ansible.builtin.assert:
    that: uptime_shared_hosting | length == 0
    fail_msg: >-
      Host the uptime server at another provider and in another city than
      the servers it watches: its hosting_provider and hosting_location must
      differ from the {{ uptime_shared_hosting | join(', ') }}, once each is
      chosen (README.md, "Choosing a provider and a size").
    quiet: true
  vars:
    uptime_watched: "{{ groups['servers'] | default([]) }}"
    uptime_watched_providers: >-
      {{ uptime_watched | map('extract', hostvars, 'hosting_provider') | map('trim') | map('lower') | list }}
    uptime_watched_locations: >-
      {{ uptime_watched | map('extract', hostvars, 'hosting_location') | map('trim') | map('lower') | list }}
    uptime_shared_hosting: >-
      {{ (uptime_watched | zip(uptime_watched_providers)
          | selectattr('1', 'match', '(' ~ (hosting_provider | trim | lower | regex_escape) ~ '$|.*replace)')
          | map(attribute='0') | map('regex_replace', '^', 'hosting_provider of ') | list)
         + (uptime_watched | zip(uptime_watched_locations)
            | selectattr('1', 'match', '(' ~ (hosting_location | trim | lower | regex_escape) ~ '$|.*replace)')
            | map(attribute='0') | map('regex_replace', '^', 'hosting_location of ') | list) }}

- name: Refuse environments the configuration cannot name
  ansible.builtin.assert:
    that:
      - uptime_environments | map(attribute='name') | reject('match', '^[a-z][a-z0-9]*$') | list | length == 0
      - uptime_environments | map(attribute='name') | unique | list | length == uptime_environments | length
      - uptime_environments | rejectattr('hostnames', 'defined') | list | length == 0
    fail_msg: >-
      Give each environment of uptime_environments its own name, in lowercase
      letters and digits, and its host names.
    quiet: true

# The status page shows the world the public environments alone, and an
# environment behind Access is never one.
- name: Refuse a public environment behind Access
  ansible.builtin.assert:
    that:
      - uptime_environments | selectattr('public', 'defined') | selectattr('public')
        | selectattr('access', 'defined') | selectattr('access') | list | length == 0
    fail_msg: >-
      An environment behind Cloudflare Access cannot be public on the status
      page: set public to false for it.
    quiet: true

# The status page has a name of its own, so the heartbeats' name shows the
# world nothing but them.
- name: Refuse a status page without a name of its own
  ansible.builtin.assert:
    that:
      - uptime_status_hostname | default('') | length > 0
      - uptime_status_hostname != uptime_hostname
    fail_msg: >-
      Give the public status page its own name, uptime_status_hostname, apart
      from uptime_hostname, or turn uptime_public_status off.
    quiet: true
  when: uptime_public_status

# On a shared host, what the owner's other sites use stays theirs: the role
# installs nothing there and changes no setting of the host's own, so it
# first checks that the host has what Gatus needs, and that the ports it
# publishes are free, before it changes anything.
- name: Look for Docker Compose on the shared host
  ansible.builtin.command: docker compose version
  register: uptime_compose_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: uptime_shared_host | bool

- name: Require Docker Compose on the shared host
  ansible.builtin.assert:
    that: uptime_compose_version.rc == 0
    fail_msg: >-
      Docker Engine and its Compose plugin must run on the shared host:
      uptime.yml installs nothing there.
    quiet: true
  when: uptime_shared_host | bool

- name: Look for the host's Caddy
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ uptime_caddy_config }}"
    - "{{ uptime_caddy_site_file | dirname }}"
  register: uptime_caddy_paths
  when: uptime_shared_host | bool

- name: Require the host's Caddy
  ansible.builtin.assert:
    that: uptime_caddy_paths.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      The shared host's Caddy needs {{ uptime_caddy_config }}, and the folder
      {{ uptime_caddy_site_file | dirname }}, which it imports with
      `import {{ uptime_caddy_site_file | dirname }}/*.caddy`; make the folder
      and add that line (README.md, "On a shared host").
    quiet: true
  when: uptime_shared_host | bool

# A port is free when no container but the uptime project's publishes it,
# whether or not Docker's proxy listens for it, and nothing else listens on
# it. Read-only, so it runs in check mode too.
- name: Find the loopback ports another service holds
  ansible.builtin.shell: |
    set -eu
    for port in {{ uptime_published_ports | join(' ') }}; do
      ours=no
      others=no
      for container in $(docker ps --filter "publish=${port}" --format '{% raw %}{{ .ID }}:{{ .Label "com.docker.compose.project" }}{% endraw %}'); do
        case "$container" in
          *:uptime) ours=yes ;;
          *) others=yes ;;
        esac
      done
      listening=$(ss -Hltn "sport = :${port}")
      if [ "$others" = yes ] || { [ "$ours" = no ] && [ -n "$listening" ]; }; then
        echo "$port"
      fi
    done
  register: uptime_held_ports
  changed_when: false
  check_mode: false
  when: uptime_shared_host | bool

- name: Refuse ports another service holds
  ansible.builtin.assert:
    that: uptime_held_ports.stdout_lines | length == 0
    fail_msg: >-
      Something else on the shared host holds {{ uptime_held_ports.stdout_lines | join(', ') }}:
      give uptime_gatus_port and uptime_status_port free ones.
    quiet: true
  when: uptime_shared_host | bool

- name: Look for the uptime folder
  ansible.builtin.stat:
    path: "{{ uptime_root }}"
  register: uptime_root_folder

# Gatus runs as this user, which owns its database and nothing else.
- name: Create the gatus user
  ansible.builtin.user:
    name: gatus
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  register: uptime_gatus_user

- name: Create the uptime folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ uptime_root }}", owner: root, group: root, mode: "0750" }
    - { path: "{{ uptime_root }}/gatus", owner: root, group: gatus, mode: "0750" }
    - { path: "{{ uptime_root }}/caddy", owner: root, group: root, mode: "0755" }
    - { path: "{{ uptime_root }}/data", owner: gatus, group: gatus, mode: "0700" }
    # The status page's own Gatus, whether or not the page is public.
    - { path: "{{ uptime_root }}/status", owner: root, group: gatus, mode: "0750" }
    - { path: "{{ uptime_root }}/status-data", owner: gatus, group: gatus, mode: "0700" }
  loop_control:
    label: "{{ item.path }}"
  # The stack's Caddy, which a shared host leaves to its own.
  when: item.path != uptime_root ~ '/caddy' or not (uptime_shared_host | bool)

# Generated on the server, one per environment whose Grafana sends a
# heartbeat, and never again once there. The value goes from openssl into
# the file, never into Ansible's output. A file with a new token replaces
# the old one whole, so a run cut short leaves the old one.
- name: Generate the heartbeat tokens
  ansible.builtin.shell: |
    set -eu
    umask 077
    cd {{ uptime_root }}
    [ -e secrets.env ] || : > secrets.env
    cp secrets.env secrets.env.new
    for name in {{ uptime_heartbeat_tokens | join(' ') }}; do
      if ! grep -q "^${name}=" secrets.env; then
        printf '%s=%s\n' "$name" "$(openssl rand -hex 32)" >> secrets.env.new
        echo "$name"
      fi
    done
    if cmp -s secrets.env secrets.env.new; then
      rm secrets.env.new
    else
      mv secrets.env.new secrets.env
    fi
  register: uptime_tokens
  changed_when: uptime_tokens.stdout | length > 0

# Credentials that outside services issued: from the vault when it holds
# them, otherwise written on the server by hand (README.md). Gatus reads them
# into its YAML between double quotes.
- name: Refuse credentials Gatus would misread
  ansible.builtin.assert:
    that: uptime_credentials.values() | map('string') | select('search', uptime_misread) | list | length == 0
    fail_msg: A credential holds a quote, a backslash or a line break, which credentials.env and Gatus cannot.
    quiet: true
  vars:
    uptime_misread: "['\"\\\\\r\n]"
  when: uptime_credentials is defined

- name: Write the credentials from the vault
  ansible.builtin.template:
    src: credentials.env.j2
    dest: "{{ uptime_root }}/credentials.env"
    owner: root
    group: root
    mode: "0600"
  when: >-
    uptime_credentials is defined
    and (not ansible_check_mode or uptime_root_folder.stat.exists)
  no_log: true

- name: Check for the credentials
  ansible.builtin.stat:
    path: "{{ uptime_root }}/credentials.env"
  register: uptime_credentials_file

- name: Require the credentials file
  ansible.builtin.assert:
    that: uptime_credentials is defined or uptime_credentials_file.stat.exists
    fail_msg: >-
      Put the credentials in the vault (uptime_credentials), or write
      {{ uptime_root }}/credentials.env on the server (README.md, "Uptime").
    quiet: true

# Names only: the values never leave the file. Read-only, so it runs in check
# mode too. A value counts once it holds a character, quoted or not: as in
# the vault, NAME= and NAME='' leave it unset.
- name: Find the credentials not set on the server
  ansible.builtin.shell: |
    set -eu
    value="=['\"]?[^'\"[:space:]]"
    for name in {{ uptime_required_credentials | join(' ') }}; do
      grep -Eq "^${name}${value}" {{ uptime_root }}/credentials.env || echo "$name"
    done
  register: uptime_unset
  changed_when: false
  check_mode: false
  when: uptime_credentials is not defined

- name: Require every credential
  ansible.builtin.assert:
    that: uptime_missing | length == 0
    fail_msg: "Set {{ uptime_missing | join(', ') }} in the credentials."
    quiet: true
  vars:
    uptime_missing: >-
      {{ uptime_required_credentials
         | difference(uptime_credentials | dict2items | rejectattr('value', 'equalto', '')
                      | rejectattr('value', 'none') | map(attribute='key') | list)
         if uptime_credentials is defined else uptime_unset.stdout_lines }}

# The optional ones, Slack's webhooks, by name as above: each turns a
# feature on (uptime_set_credentials), and its absence stops nothing.
- name: Find the optional credentials set on the server
  ansible.builtin.shell: |
    set -eu
    value="=['\"]?[^'\"[:space:]]"
    for name in {{ uptime_optional_credentials | join(' ') }}; do
      if grep -Eqs "^${name}${value}" {{ uptime_root }}/credentials.env; then
        echo "$name"
      fi
    done
  register: uptime_optional_set
  changed_when: false
  check_mode: false
  when: uptime_credentials is not defined

# The status page's mark, icon and fonts, from the repository: the web
# app's, and peal-ui's Geist (DESIGN.md). Readable by anyone, as a site's
# files are: a shared host's Caddy serves them as its own user.
- name: Require the status page's fonts
  ansible.builtin.stat:
    path: "{{ item.src }}"
  loop: "{{ uptime_brand_files }}"
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: localhost
  become: false
  register: uptime_brand_sources
  when: uptime_public_status

- name: Refuse a status page without its fonts
  ansible.builtin.assert:
    that: uptime_brand_sources.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      The status page needs {{ uptime_brand_sources.results | rejectattr('stat.exists')
      | map(attribute='item.src') | join(', ') }}: run
      `bun install --frozen-lockfile` at the repository's root first.
    quiet: true
  when: uptime_public_status

- name: Create the status page's folder
  ansible.builtin.file:
    path: "{{ uptime_brand_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: uptime_brand_folder
  when: uptime_public_status

- name: Copy the status page's mark and fonts
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ uptime_brand_root }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ uptime_brand_files }}"
  loop_control:
    label: "{{ item.dest }}"
  when:
    - uptime_public_status
    - not (ansible_check_mode and uptime_brand_folder is changed)

- name: Render the configuration
  ansible.builtin.set_fact:
    uptime_gatus_config: "{{ lookup('ansible.builtin.template', 'config.yaml.j2') }}"
    uptime_status_config: "{{ lookup('ansible.builtin.template', 'status-config.yaml.j2') }}"
    uptime_caddyfile: "{{ lookup('ansible.builtin.template', 'Caddyfile.j2') }}"
    uptime_caddy_routes: "{{ lookup('ansible.builtin.template', 'routes.caddy.j2') }}"
    uptime_caddy_status: "{{ lookup('ansible.builtin.template', 'status.caddy.j2') }}"

# A task of its own: the site file inlines the routes, and a fact set in a
# task is not defined for the other values of that same task.
- name: Render a shared host's site file
  ansible.builtin.set_fact:
    uptime_caddy_site: "{{ lookup('ansible.builtin.template', 'site.caddy.j2') }}"

- name: Write Gatus's configurations
  ansible.builtin.copy:
    dest: "{{ uptime_root }}/{{ item.folder }}/config.yaml"
    content: "{{ item.content }}"
    owner: root
    group: gatus
    mode: "0640"
  loop:
    - { folder: gatus, content: "{{ uptime_gatus_config }}" }
    # Written either way; Compose runs it when the page is public.
    - { folder: status, content: "{{ uptime_status_config }}" }
  loop_control:
    label: "{{ item.folder }}"
  when: not ansible_check_mode or uptime_root_folder.stat.exists

- name: Write Caddy's configuration
  ansible.builtin.copy:
    dest: "{{ uptime_root }}/caddy/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { name: Caddyfile, content: "{{ uptime_caddyfile }}" }
    - { name: routes.caddy, content: "{{ uptime_caddy_routes }}" }
    # Written either way; the Caddyfile imports it when the page is public.
    - { name: status.caddy, content: "{{ uptime_caddy_status }}" }
  loop_control:
    label: "{{ item.name }}"
  when:
    - not (uptime_shared_host | bool)
    - not ansible_check_mode or uptime_root_folder.stat.exists

- name: Write the stack's Compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ uptime_root }}/compose.yaml"
    owner: root
    group: root
    mode: "0640"
  when: not ansible_check_mode or uptime_root_folder.stat.exists

- name: Install uptime-compose
  ansible.builtin.template:
    src: uptime-compose.j2
    dest: "{{ uptime_compose_bin }}"
    owner: root
    group: root
    mode: "0755"

# Compose creates what is missing and recreates a service whose image or
# configuration changed (its peal.config label), and nothing else.
- name: Start the stack
  ansible.builtin.command: "{{ uptime_compose_bin }} up --detach --wait --wait-timeout 120 --remove-orphans"
  register: uptime_up
  changed_when: uptime_up.stderr is search('(Started|Recreated|Removed)')

- name: Check that Gatus answers
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ uptime_gatus_port }}/health
  register: uptime_health
  until: uptime_health.status == 200
  retries: 20
  delay: 3
  when: not ansible_check_mode

- name: Check that the status page's Gatus answers
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ uptime_status_port }}/health
  register: uptime_status_health
  until: uptime_status_health.status == 200
  retries: 20
  delay: 3
  when:
    - uptime_shared_host | bool
    - uptime_public_status
    - not ansible_check_mode

# On a shared host, the host's Caddy serves the uptime names from a site file
# of the role's, which its configuration imports. The whole configuration,
# the owner's sites included, must load with the file before Caddy reloads:
# Caddy validates it as the service's user, and adapts it to find each
# name. A file Caddy refuses, or does not import, comes out again, or goes
# back to what it was, so the next start of Caddy finds the configuration
# that runs. The file holds no secret.
- name: Serve the uptime names through the host's Caddy
  when: uptime_shared_host | bool
  block:
    - name: Look for the site file
      ansible.builtin.stat:
        path: "{{ uptime_caddy_site_file }}"
      register: uptime_site_before

    - name: Read the site file as it was
      ansible.builtin.slurp:
        src: "{{ uptime_caddy_site_file }}"
      register: uptime_site_previous
      when: uptime_site_before.stat.exists

    # Readable by Caddy's user; root owns it.
    - name: Write the site file
      ansible.builtin.copy:
        dest: "{{ uptime_caddy_site_file }}"
        content: "{{ uptime_caddy_site }}"
        mode: "0644"
      register: uptime_site

    # Read-only, so it runs in check mode too, once the file is there: a
    # configuration the owner broke since stops the run before a reload.
    - name: Validate the host's Caddy configuration
      ansible.builtin.command: >-
        {{ uptime_caddy_bin }} validate --config {{ uptime_caddy_config }} --adapter caddyfile
      become: true
      become_user: "{{ uptime_caddy_user }}"
      changed_when: false
      check_mode: false
      when: not (ansible_check_mode and uptime_site is changed)

    # Names only: the configuration, which holds the owner's sites, stays in
    # the shell.
    - name: Find the uptime names the host's Caddy does not serve
      ansible.builtin.shell: |
        set -eu
        adapted=$({{ uptime_caddy_bin }} adapt --config {{ uptime_caddy_config }} --adapter caddyfile)
        for name in {{ uptime_caddy_names | join(' ') }}; do
          case "$adapted" in
            *"\"$name\""*) ;;
            *) echo "$name" ;;
          esac
        done
      become: true
      become_user: "{{ uptime_caddy_user }}"
      register: uptime_unserved
      changed_when: false
      check_mode: false
      when: not (ansible_check_mode and uptime_site is changed)

    - name: Require the host's Caddy to import the site file
      ansible.builtin.assert:
        that: uptime_unserved.stdout_lines | length == 0
        fail_msg: >-
          The host's Caddy does not serve {{ uptime_unserved.stdout_lines | join(', ') }}
          from {{ uptime_caddy_site_file }}: add
          `import {{ uptime_caddy_site_file | dirname }}/*.caddy` to
          {{ uptime_caddy_config }} (README.md, "On a shared host").
        quiet: true
      when: uptime_unserved is not skipped

  rescue:
    - name: Put the site file back as it was
      ansible.builtin.copy:
        dest: "{{ uptime_caddy_site_file }}"
        content: "{{ uptime_site_previous.content | b64decode }}"
        mode: "0644"
      when:
        - uptime_site is defined and uptime_site is changed
        - uptime_site_before.stat.exists

    - name: Take the site file out
      ansible.builtin.file:
        path: "{{ uptime_caddy_site_file }}"
        state: absent
      when:
        - uptime_site is defined and uptime_site is changed
        - not uptime_site_before.stat.exists

    - name: Report why the site file came out
      ansible.builtin.fail:
        msg: >-
          {{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default('') }}
          {{ ansible_failed_result.stderr | default('') }}

# What the host's Caddy runs, read from its admin API: the owner's sites are
# in it, so it stays out of the output.
- name: Read the configuration the host's Caddy runs
  ansible.builtin.uri:
    url: "{{ uptime_caddy_admin }}/config/"
    return_content: true
  register: uptime_caddy_running
  check_mode: false
  no_log: true
  when: uptime_shared_host | bool

# Caddy's unit reloads through its admin API, gracefully: the new
# configuration replaces the old without dropping connections, and Caddy
# keeps the old when it refuses the new. Also when an earlier run wrote the
# file but did not get to reload.
- name: Reload the host's Caddy
  ansible.builtin.systemd_service:
    name: "{{ uptime_caddy_service }}"
    state: reloaded
  register: uptime_caddy_reload
  when:
    - uptime_shared_host | bool
    - uptime_site is changed or uptime_unserved_running | length > 0
  vars:
    uptime_unserved_running: >-
      {{ uptime_caddy_names | map('to_json') | reject('in', uptime_caddy_running.content) | list }}

- name: Check that the host's Caddy serves the uptime names
  ansible.builtin.uri:
    url: "{{ uptime_caddy_admin }}/config/"
    return_content: true
  register: uptime_caddy_reloaded
  until: uptime_caddy_names | map('to_json') | reject('in', uptime_caddy_reloaded.content | default('')) | list | length == 0
  retries: 10
  delay: 2
  no_log: true
  when:
    - uptime_shared_host | bool
    - uptime_caddy_reload is changed
    - not ansible_check_mode

# The platform watch (README.md, "The platform watch"): the platforms'
# changelog pages and feeds, read every 6 hours by a script of the standard
# library's alone, as the gatus user, and what changed posted to Slack. It
# runs once SLACK_CHANGELOG_WEBHOOK_URL is set, and stops when it is not.
- name: Refuse platform watch sources the watch cannot read
  ansible.builtin.assert:
    that:
      - uptime_platform_watch_sources | rejectattr('name', 'defined') | list | length == 0
      - uptime_platform_watch_sources | rejectattr('platform', 'defined') | list | length == 0
      - uptime_platform_watch_sources | rejectattr('url', 'defined') | list | length == 0
      - uptime_platform_watch_sources | map(attribute='url') | reject('match', 'https://[^\s]+$') | list | length == 0
      - uptime_platform_watch_sources | map(attribute='kind') | reject('in', ['page', 'feed']) | list | length == 0
      - uptime_platform_watch_sources | map(attribute='url') | unique | list | length == uptime_platform_watch_sources | length
    fail_msg: >-
      Give each source of uptime_platform_watch_sources a name, a platform,
      an https:// URL of its own and a kind, page or feed.
    quiet: true

- name: Look for the platform watch's timer
  ansible.builtin.stat:
    path: /etc/systemd/system/peal-platform-watch.timer
  register: uptime_platform_watch_timer

- name: Stop the platform watch without its webhook
  ansible.builtin.systemd_service:
    name: peal-platform-watch.timer
    state: stopped
    enabled: false
  when:
    - not (uptime_platform_watch | bool)
    - uptime_platform_watch_timer.stat.exists

# Its copies stay, so a webhook set again posts what changed since.
- name: Remove the platform watch without its webhook
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/peal-platform-watch.timer
    - /etc/systemd/system/peal-platform-watch.service
    - "{{ uptime_root }}/platform-watch.env"
  notify: Reload systemd for the platform watch
  when: not (uptime_platform_watch | bool)

- name: Look for the platform watch's Python
  ansible.builtin.stat:
    path: "{{ uptime_platform_watch_python }}"
  register: uptime_platform_watch_python_found
  when: uptime_platform_watch | bool

- name: Require the platform watch's Python
  ansible.builtin.assert:
    that: uptime_platform_watch_python_found.stat.exists
    fail_msg: >-
      The platform watch runs on {{ uptime_platform_watch_python }}, which the
      server lacks: set uptime_platform_watch_python to its Python 3.
    quiet: true
  when: uptime_platform_watch | bool

- name: Install the platform watch
  ansible.builtin.copy:
    src: platform_watch.py
    dest: "{{ uptime_platform_watch_bin }}"
    owner: root
    group: root
    mode: "0755"
  when: uptime_platform_watch | bool

# The folder is root's, readable by gatus; gatus alone reads and writes the
# copies, in state/.
- name: Create the platform watch's folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: gatus
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ uptime_platform_watch_root }}", owner: root, mode: "0750" }
    - { path: "{{ uptime_platform_watch_root }}/state", owner: gatus, mode: "0700" }
  loop_control:
    label: "{{ item.path }}"
  register: uptime_platform_watch_folders
  when: uptime_platform_watch | bool

- name: Write the platform watch's sources
  ansible.builtin.copy:
    content: "{{ uptime_platform_watch_sources | to_nice_json }}\n"
    dest: "{{ uptime_platform_watch_root }}/sources.json"
    owner: root
    group: gatus
    mode: "0640"
  when:
    - uptime_platform_watch | bool
    - not (ansible_check_mode and uptime_platform_watch_folders is changed)

# Its webhook alone, from the credentials, in a file only root reads, which
# systemd hands the service as its environment. The value goes from one
# file to the other in the shell, never into Ansible's output.
- name: Give the platform watch its webhook
  ansible.builtin.shell: |
    set -eu
    umask 077
    cd {{ uptime_root }}
    grep '^SLACK_CHANGELOG_WEBHOOK_URL=' credentials.env > platform-watch.env.new
    if cmp -s platform-watch.env platform-watch.env.new; then
      rm platform-watch.env.new
    else
      mv platform-watch.env.new platform-watch.env
      echo changed
    fi
  register: uptime_platform_watch_webhook
  changed_when: uptime_platform_watch_webhook.stdout | length > 0
  when: uptime_platform_watch | bool

- name: Write the platform watch's service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - peal-platform-watch.service
    - peal-platform-watch.timer
  notify: Reload systemd for the platform watch
  when: uptime_platform_watch | bool

- name: Apply the platform watch's units now
  ansible.builtin.meta: flush_handlers

- name: Start the platform watch's timer at boot
  ansible.builtin.systemd_service:
    name: peal-platform-watch.timer
    state: started
    enabled: true
  when:
    - uptime_platform_watch | bool
    - not ansible_check_mode or uptime_platform_watch_timer.stat.exists
