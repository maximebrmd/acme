---
# The credentials Gatus needs, by name: its Telegram bot, the bot and chat
# of each environment with a chat of its own, and the Cloudflare Access
# service token of each environment behind Access.
uptime_required_credentials: >-
  {{ ['TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID']
     + (uptime_environments | selectattr('telegram', 'defined') | selectattr('telegram')
        | map(attribute='name') | map('upper')
        | product(['_TELEGRAM_BOT_TOKEN', '_TELEGRAM_CHAT_ID']) | map('join') | list)
     + (uptime_environments | selectattr('access', 'defined') | selectattr('access')
        | map(attribute='name') | map('upper')
        | product(['_ACCESS_CLIENT_ID', '_ACCESS_CLIENT_SECRET']) | map('join') | list) }}

# The credentials the server may have, by name, whose absence turns a
# feature off rather than stopping the run: the Slack webhook production's
# alerts and the uptime server's own go to, that of each environment with a
# channel of its own (slack: true in uptime_environments), and the platform
# watch's (README.md, "Slack").
uptime_optional_credentials: >-
  {{ ['SLACK_ALERTS_WEBHOOK_URL']
     + (uptime_slack_own_channels | map('upper') | map('regex_replace', '^', 'SLACK_')
        | map('regex_replace', '$', '_ALERTS_WEBHOOK_URL') | list)
     + ['SLACK_CHANGELOG_WEBHOOK_URL'] }}
uptime_slack_own_channels: >-
  {{ uptime_environments | selectattr('slack', 'defined') | selectattr('slack') | map(attribute='name') | list }}

# The credentials that hold a value, by name: the vault's, or the optional
# ones the role found set in credentials.env on the server. A template
# rendered before either is known (tests/render.yml) finds none.
uptime_set_credentials: >-
  {{ (uptime_credentials | dict2items | rejectattr('value', 'equalto', '') | rejectattr('value', 'none')
      | map(attribute='key') | list)
     if uptime_credentials is defined
     else (uptime_optional_set.stdout_lines | default([])) }}

# The Slack webhook each group of checks alerts, by the credential's name,
# for the groups whose webhook is set: an environment with a channel of its
# own its SLACK_<NAME>_ALERTS_WEBHOOK_URL, the others and the uptime
# server's own checks SLACK_ALERTS_WEBHOOK_URL. A group left out alerts on
# Telegram alone.
uptime_slack_channels: >-
  {{ dict(((uptime_environments | map(attribute='name') | reject('in', uptime_slack_own_channels) | list) + ['uptime'])
          | product(['SLACK_ALERTS_WEBHOOK_URL']))
     | combine(dict(uptime_slack_own_channels
                    | zip(uptime_slack_own_channels | map('upper') | map('regex_replace', '^', 'SLACK_')
                          | map('regex_replace', '$', '_ALERTS_WEBHOOK_URL'))))
     | dict2items | selectattr('value', 'in', uptime_set_credentials) | items2dict }}

# The platform watch runs once its webhook is set (README.md, "The platform
# watch").
uptime_platform_watch: "{{ 'SLACK_CHANGELOG_WEBHOOK_URL' in uptime_set_credentials }}"

# The heartbeat tokens generated on the server, one per environment whose
# Grafana sends a heartbeat.
uptime_heartbeat_tokens: >-
  {{ uptime_environments | selectattr('heartbeat', 'defined') | selectattr('heartbeat')
     | map(attribute='name') | map('upper') | map('regex_replace', '$', '_HEARTBEAT_TOKEN') | list }}

# The files of the status page's brand folder (uptime_brand_root), from the
# repository's packages: the web app's mark and icon, and peal-ui's Geist
# with its licence, which goes with the fonts.
uptime_packages: "{{ role_path }}/../../../.."
uptime_geist: "{{ uptime_packages }}/peal-ui/node_modules/geist"
uptime_brand_files:
  - src: "{{ uptime_packages }}/peal-web/src/app/icon.svg"
    dest: mark.svg
  - src: "{{ uptime_packages }}/peal-web/src/app/apple-icon.png"
    dest: apple-touch-icon.png
  - src: "{{ uptime_geist }}/dist/fonts/geist-sans/Geist-Variable.woff2"
    dest: geist.woff2
  - src: "{{ uptime_geist }}/dist/fonts/geist-mono/GeistMono-Variable.woff2"
    dest: geist-mono.woff2
  - src: "{{ uptime_geist }}/LICENSE.txt"
    dest: geist-license.txt

# Where Caddy reaches each Gatus: on the stack's network on a server of its
# own, on the host's loopback on a shared host.
uptime_gatus_upstream: "{{ '127.0.0.1:%s' % uptime_gatus_port if uptime_shared_host | bool else 'gatus:8080' }}"
uptime_status_upstream: "{{ '127.0.0.1:%s' % uptime_status_port if uptime_shared_host | bool else 'status:8080' }}"

# On a shared host: the names its Caddy serves for the uptime server, and the
# loopback ports the stack publishes there.
uptime_caddy_names: "{{ [uptime_hostname] + ([uptime_status_hostname] if uptime_public_status else []) }}"
uptime_published_ports: "{{ [uptime_gatus_port] + ([uptime_status_port] if uptime_public_status else []) }}"
