---
# The server holds no repository or registry credentials. The machine running
# Ansible checks the commit out from GitHub, builds the images for the
# server's architecture, and uploads them over SSH with the release's Compose
# file, so only pushed commits can be released. The server never builds
# (--no-build). Starting the new server applies its migrations before it
# listens.
- name: Require the runtime that site.yml sets up
  ansible.builtin.stat:
    path: "{{ peal_compose_bin }}"
  register: peal_release_runtime

- name: Stop unless site.yml has run
  ansible.builtin.assert:
    that: peal_release_runtime.stat.exists
    fail_msg: Run site.yml on {{ inventory_hostname }} before releasing.
    quiet: true

- name: Create the local release folder
  ansible.builtin.file:
    path: "{{ peal_release_local_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Check the release out
  ansible.builtin.git:
    repo: "{{ peal_release_repo_url }}"
    dest: "{{ peal_release_local_dir }}/checkout"
    version: "{{ peal_version }}"
    force: true
  delegate_to: localhost
  become: false
  register: peal_release_checkout

# Postgres's image is named after its Dockerfile, so it changes, and
# Postgres restarts, only when that file does.
- name: Read the Postgres image's Dockerfile
  ansible.builtin.stat:
    path: "{{ peal_release_local_dir }}/checkout/packages/peal-docker/postgres.Dockerfile"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: peal_release_postgres_dockerfile

# Read here, from the server's facts, rather than in the builds below, which
# run on the machine running Ansible.
- name: Name the release
  ansible.builtin.set_fact:
    peal_release_platform: >-
      {{ peal_image_platform
         | default(peal_release_platforms[ansible_facts.architecture]
                   | default('linux/' ~ ansible_facts.architecture)) }}
    peal_release_tag: "{{ peal_release_checkout.after[:12] }}"
    peal_release_postgres_tag: "{{ peal_release_postgres_dockerfile.stat.checksum[:12] }}"
    peal_release_dir: "{{ peal_root }}/releases/{{ peal_release_checkout.after[:12] }}"

- name: Name the release's images
  ansible.builtin.set_fact:
    peal_release_built:
      postgres: peal-postgres:{{ peal_release_postgres_tag }}
      server: peal-server:{{ peal_release_tag }}
      web: peal-web:{{ peal_release_tag }}
      static: peal-static:{{ peal_release_tag }}

# Its id only: an image's full description is long, and the release needs
# nothing else from it.
- name: Check for each image on the server
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - --format
      - "{% raw %}{{.Id}}{% endraw %}"
      - "{{ item.value }}"
  loop: "{{ peal_release_built | dict2items }}"
  loop_control:
    label: "{{ item.value }}"
  register: peal_release_present
  changed_when: false
  failed_when: false

# Only the images the server lacks are built and uploaded. Loading one it
# has would move its tag to a new build of the same Dockerfile, and Compose
# would recreate the container, Postgres's included, for nothing.
- name: Name the images to upload
  ansible.builtin.set_fact:
    peal_release_missing: >-
      {{ peal_release_present.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item.key') | list }}

# Built and saved once per set of images, platform and environment: `creates`
# skips the build when the archive is there, such as when an upload is run
# again.
- name: Name the archive
  ansible.builtin.set_fact:
    peal_release_archive: >-
      {{ peal_release_local_dir }}/images-{{ peal_environment }}-{{
         ((peal_release_missing | map('extract', peal_release_built) | list + [peal_release_platform])
          | join(' ') | hash('sha256'))[:12] }}.tar.gz

- name: Look for the release's archive
  ansible.builtin.stat:
    path: "{{ peal_release_archive }}"
  delegate_to: localhost
  become: false
  register: peal_release_local_archive

- name: Build and upload the images
  when: peal_release_missing | length > 0
  block:
    - name: Build the images
      ansible.builtin.command:
        argv:
          - docker
          - buildx
          - build
          - --platform
          - "{{ peal_release_platform }}"
          - --file
          - packages/peal-docker/{{ item }}.Dockerfile
          - --tag
          - "{{ peal_release_built[item] }}"
          - --load
          - .
        chdir: "{{ peal_release_local_dir }}/checkout"
      loop: "{{ peal_release_missing | difference(['static']) }}"
      delegate_to: localhost
      become: false
      changed_when: true
      when: not peal_release_local_archive.stat.exists

    # The site and the docs read their settings at build time, so each
    # environment builds its own; docker takes each --build-arg's value from
    # the environment.
    - name: Build the static image
      ansible.builtin.command:
        argv: >-
          {{ ['docker', 'buildx', 'build', '--platform', peal_release_platform,
              '--file', 'packages/peal-docker/static.Dockerfile',
              '--tag', peal_release_built.static, '--load']
             + (['--build-arg'] | product(peal_static_build_args.keys()) | flatten)
             + ['.'] }}
        chdir: "{{ peal_release_local_dir }}/checkout"
      environment: "{{ peal_static_build_args }}"
      delegate_to: localhost
      become: false
      changed_when: true
      when: not peal_release_local_archive.stat.exists and 'static' in peal_release_missing

    - name: Save the images
      ansible.builtin.shell: |
        set -euo pipefail
        docker save {{ peal_release_missing | map('extract', peal_release_built) | join(' ') }} \
          | gzip -1 > {{ peal_release_archive }}.part
        mv {{ peal_release_archive }}.part {{ peal_release_archive }}
      args:
        executable: /bin/bash
        creates: "{{ peal_release_archive }}"
      delegate_to: localhost
      become: false

    - name: Upload the images
      ansible.builtin.copy:
        src: "{{ peal_release_archive }}"
        dest: "{{ peal_root }}/images/{{ peal_release_tag }}.tar.gz"
        owner: root
        group: root
        mode: "0600"

    - name: Load the images
      ansible.builtin.command: docker load --input {{ peal_root }}/images/{{ peal_release_tag }}.tar.gz
      changed_when: true

    - name: Remove the uploaded archive
      ansible.builtin.file:
        path: "{{ peal_root }}/images/{{ peal_release_tag }}.tar.gz"
        state: absent

- name: Create the release folder
  ansible.builtin.file:
    path: "{{ peal_release_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The Compose file and the configuration it mounts, which hold no secret: the
# containers' own users read them.
- name: Upload the stack's files
  ansible.builtin.copy:
    src: "{{ peal_release_local_dir }}/checkout/packages/peal-docker/"
    dest: "{{ peal_release_dir }}/"
    owner: root
    group: root
    mode: u=rwX,g=rX,o=rX

- name: Name the release that runs
  ansible.builtin.copy:
    dest: "{{ peal_root }}/release.env"
    content: |
      # Managed by Ansible (peal-infra): the images compose.production.yaml runs.
      PEAL_VERSION={{ peal_release_tag }}
      PEAL_POSTGRES_VERSION={{ peal_release_postgres_tag }}
    owner: root
    group: root
    mode: "0640"

- name: Point current at the release
  ansible.builtin.file:
    src: "{{ peal_release_dir }}"
    dest: "{{ peal_root }}/current"
    state: link

# The Bluesky client's private key, generated once on the server by the
# release's own image, which reaches no network for it. The key goes from the
# command's output straight into secrets.env, never into Ansible's.
- name: Create the Bluesky client key
  ansible.builtin.shell: |
    set -eu
    if grep -q '^BLUESKY_CLIENT_KEYS=' {{ peal_root }}/secrets.env; then
      exit 0
    fi
    key="$(docker run --rm --network none peal-server:{{ peal_release_tag }} packages/peal-server/scripts/bluesky-key.ts)"
    umask 077
    printf 'BLUESKY_CLIENT_KEYS=%s\n' "$key" >> {{ peal_root }}/secrets.env
    echo created
  register: peal_release_bluesky_key
  changed_when: peal_release_bluesky_key.stdout == 'created'

# On a server that bills, Stripe's catalogue for per-account pricing is
# compared with the one the new release's image gives, before that image
# replaces the server: read-only at Stripe, with the key that stays in
# credentials.env. The command's exit code says how it ended
# (catalogueExitCode): 3, the catalogue differs, and 4, Stripe refused the
# key or answered what cannot be read, are what the new server's start
# check stops on, so the release stops here, the old server still running,
# until the operator gives Stripe the catalogue or fixes the key (README.md,
# "Stripe catalogue") and releases again. 5, Stripe not answering, and any
# other failure (Compose) are reported: the new server starts then, as it
# does when Stripe does not answer. Names only: the key is never read.
- name: Compare Stripe's catalogue with the release's
  ansible.builtin.shell: |
    set -u
    if ! grep -Eq "^STRIPE_SECRET_KEY=['\"]?[^'\"[:space:]]" {{ peal_root }}/credentials.env; then
      echo 'billing off'
      exit 0
    fi
    {{ peal_compose_bin }} run --rm --no-deps -T server packages/peal-server/scripts/stripe-catalogue.ts --check
  register: peal_release_catalogue
  changed_when: false
  failed_when: false

- name: Stop the release on a Stripe catalogue its server would not start on
  ansible.builtin.fail:
    msg:
      - "Stripe's catalogue differs from this release's, or Stripe refused the key: its server would not start. The old server still runs."
      - "Give Stripe the catalogue with this release's image, or fix the key, then release again:"
      - sudo peal-compose run --rm --no-deps server packages/peal-server/scripts/stripe-catalogue.ts
      - "{{ peal_release_catalogue.stdout_lines + peal_release_catalogue.stderr_lines }}"
  when: (peal_release_catalogue.rc | default(0)) in [3, 4]

- name: Report a Stripe catalogue that could not be compared
  ansible.builtin.debug:
    msg:
      - "Stripe's catalogue could not be compared with this release's (Stripe not answering, or Compose failing)."
      - "The release goes on: the new server checks it again as it starts."
      - "{{ peal_release_catalogue.stdout_lines + peal_release_catalogue.stderr_lines }}"
  when: (peal_release_catalogue.rc | default(0)) not in [0, 3, 4]

# Compose recreates Postgres when its image or its settings changed: the old
# server then stops first, with 75 seconds to finish its platform calls, so
# it never runs against a Postgres that restarts. Pages stay up meanwhile.
# Otherwise Postgres keeps running, and Compose replaces the server below
# only if its image changed. These read what Compose compares, the image and
# the hash of the service's settings, and never the container's environment,
# which holds the database password and the backup passphrase.
- name: Read what Postgres runs
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - --format
      - '{% raw %}{{.Image}} {{index .Config.Labels "com.docker.compose.config-hash"}}{% endraw %}'
      - "{{ peal_compose_project }}-postgres-1"
  register: peal_release_running_postgres
  changed_when: false
  failed_when: false

- name: Read what Postgres is to run
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - --format
      - "{% raw %}{{.Id}}{% endraw %}"
      - "{{ peal_release_built.postgres }}"
  register: peal_release_postgres_image
  changed_when: false

- name: Read the settings Postgres is to run with
  ansible.builtin.command:
    argv: ["{{ peal_compose_bin }}", config, --hash, postgres]
  register: peal_release_postgres_settings
  changed_when: false

- name: Stop the old server before Postgres restarts
  ansible.builtin.command: "{{ peal_compose_bin }} stop server"
  register: peal_release_stop
  changed_when: peal_release_stop.stderr is search('Stopped')
  when: >-
    peal_release_running_postgres.rc != 0
    or peal_release_running_postgres.stdout.split()
       != [peal_release_postgres_image.stdout, peal_release_postgres_settings.stdout.split() | last]

- name: Start Postgres
  ansible.builtin.command: "{{ peal_compose_bin }} up --no-build --detach --wait --wait-timeout 300 postgres"
  register: peal_release_postgres
  changed_when: peal_release_postgres.stderr is search('(Started|Recreated)')

# A database restored onto a new server keeps the password of the one it
# came from. The check signs in over the network, by the service's name, as
# the server does: the image trusts every connection from inside its
# container, over 127.0.0.1 too, whatever the password. Read-only unless the
# generated password is refused.
- name: Check the database password
  ansible.builtin.command:
    argv:
      - "{{ peal_compose_bin }}"
      - exec
      - -T
      - postgres
      - sh
      - -c
      - PGPASSWORD="$POSTGRES_PASSWORD" psql --host postgres --username peal --dbname peal --no-psqlrc --quiet --command 'SELECT 1'
  register: peal_release_password
  changed_when: false
  failed_when: false

# psql reads the password from its own environment (\getenv), so it is on no
# command line, and the statement is kept out of Postgres's log.
- name: Set the database password to the generated one
  ansible.builtin.command:
    argv:
      - "{{ peal_compose_bin }}"
      - exec
      - -T
      - postgres
      - psql
      - --username
      - peal
      - --dbname
      - peal
      - --no-psqlrc
      - --quiet
      - --set
      - ON_ERROR_STOP=1
    stdin: |
      \getenv password POSTGRES_PASSWORD
      SET log_statement = 'none';
      ALTER ROLE peal PASSWORD :'password';
  when: peal_release_password.rc != 0
  changed_when: true

# The new server migrates the database before it listens: --wait returns
# once it is healthy.
- name: Start the server, which migrates the database
  ansible.builtin.command: "{{ peal_compose_bin }} up --no-build --detach --wait --wait-timeout 600 server"
  register: peal_release_server
  changed_when: peal_release_server.stderr is search('(Started|Recreated)')

# collector-wget copies the collector's health-check wget and exits, so
# Compose starts it at every `up`: that start alone is no change, but its
# recreation is (tests/test_release_stack.py).
- name: Start the rest of the stack
  ansible.builtin.command: "{{ peal_compose_bin }} up --no-build --detach --wait --wait-timeout 600 --remove-orphans"
  register: peal_release_stack
  changed_when: >-
    peal_release_stack.stderr_lines | reject('search', 'collector-wget-[0-9]+ +Started')
    | select('search', '(Started|Recreated|Removed)') | list | length > 0

- name: Check the server and the web app on the server
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ item.port }}{{ item.path }}
    status_code: [200, 204]
  loop:
    - { port: "{{ peal_ports.server }}", path: /api/ready }
    - { port: "{{ peal_ports.web }}", path: /sign-in }
  register: peal_release_local
  until: peal_release_local.status in [200, 204]
  retries: 10
  delay: 3

# From the machine running Ansible, through Cloudflare. Access guards every
# page of the sandbox, so only production is checked this way.
- name: Check the app through the tunnel
  ansible.builtin.uri:
    url: https://{{ peal_hostnames.app }}/api/health
    status_code: 204
  delegate_to: localhost
  become: false
  register: peal_release_public
  until: peal_release_public.status == 204
  retries: 10
  delay: 3
  when: not peal_access_everything

- name: List the releases
  ansible.builtin.find:
    paths: "{{ peal_root }}/releases"
    file_type: directory
  register: peal_release_dirs

- name: Remove older releases
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: >-
    {{ (peal_release_dirs.files | sort(attribute='mtime', reverse=true))[peal_release_keep:]
       | rejectattr('path', 'equalto', peal_release_dir) | list }}
  loop_control:
    label: "{{ item.path | basename }}"

# Removes the images no container uses that were built more than a week ago
# (`until` reads when an image was built, not when it was last used): a
# release built within the week goes back out without an upload, and an
# older one is built and uploaded again.
- name: Remove images unused for a week
  ansible.builtin.command: docker image prune --all --force --filter until=168h
  tags: [prune]
  register: peal_release_prune
  changed_when: peal_release_prune.stdout is not search('Total reclaimed space:\s+0B')

- name: List the local archives
  ansible.builtin.find:
    paths: "{{ peal_release_local_dir }}"
    patterns: images-{{ peal_environment }}-*.tar.gz
  delegate_to: localhost
  become: false
  register: peal_release_archives

- name: Remove older local archives
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ peal_release_archives.files | rejectattr('path', 'equalto', peal_release_archive) | list }}"
  loop_control:
    label: "{{ item.path | basename }}"
  delegate_to: localhost
  become: false
