---
# Settings both environments share. Each environment's own are in
# group_vars/<environment>/main.yml, and the credentials that outside
# services issue in group_vars/<environment>/vault.yml, encrypted with
# ansible-vault and ignored by Git (vault.example.yml lists them), or on the
# server itself (README.md).

# Every playbook logs in as the admin user. Once the tunnel serves SSH, it
# goes through cloudflared on the machine running Ansible, and the server
# opens no inbound port.
ansible_user: "{{ admin_user }}"
ansible_ssh_common_args: >-
  {{ ('-o ProxyCommand="cloudflared access ssh --hostname ' ~ peal_hostnames.ssh ~ '"')
     if ssh_via_tunnel | bool else '' }}

# Key-only admin account with passwordless sudo. Root cannot log in over SSH.
admin_user: ops
# Exclusive: removing a key here revokes it on the server.
admin_ssh_public_keys:
  - ssh-ed25519 REPLACE-WITH-AN-ADMIN-PUBLIC-KEY ops@example.com

# The account a new server's image lets in with your key, which
# bootstrap.yml logs in as, once, to create the admin user: root, or the
# account the image comes with (ubuntu on Ubuntu's own cloud images), which
# has sudo. Set it for a group whose provider's image does not take root.
# The ssh role then removes that account, with its sudo rule, once the admin
# user works (README.md, "A new server").
bootstrap_user: root

# false only while bootstrapping a server, before the tunnel serves SSH:
# port 22 is then open, rate limited, and Ansible connects to ansible_host.
ssh_via_tunnel: true

# The swap file, made of swap_size_mb when it does not exist. A server whose
# image already made one names it in its group (/swap.img, from Ubuntu's
# installer), and the system role reuses it as it is: swap_size_mb is read
# only when the file is made.
swap_file: /swapfile
swap_size_mb: 2048
# Security updates install daily; a kernel update reboots at this time (UTC),
# unless an md array is degraded (peal-reboot).
unattended_reboot_time: "03:30"

# cloudflared, from its GitHub release, checked against these digests.
cloudflared_version: 2026.10.7
cloudflared_deb_sha256:
  amd64: 70b1a1e0f46033ffc8d90b406e554044ba6cbf2e4360295ef1163aed31e09393
  arm64: d9407eb6e70ac31f54978a6b408a0320b51b664a6d0b498248692d7ac56bf836

peal_root: /srv/peal
peal_compose_project: peal
# The host name short links are on, a domain of their own (peal.link, its
# zone in packages/peal-infra/pulumi), where Cloudflare's edge rewrites
# /<code> to /api/l/<code>: the tunnel sends that path alone to the server,
# and the server issues links on https://<this name>/ (PEAL_SHORT_LINK_BASE).
# Empty: no route, and short links are off.
peal_short_link_hostname: ""
# Docker Compose on the release that runs (peal_runtime writes it).
peal_compose_bin: /usr/local/bin/peal-compose
# The docs run as a Node server, for their assistant, when the build
# arguments name its model (peal_static_build_args.DOCS_ASSISTANT_MODEL):
# release.yml builds the docs image, Compose runs its profile, and the
# tunnel sends the docs' host name to it rather than to the static image.
peal_docs_server: "{{ peal_static_build_args.DOCS_ASSISTANT_MODEL | default('') | length > 0 }}"
# Compose profiles the stack runs with: the marketing site and the docs, and
# the docs server.
peal_compose_profiles: "{{ ['static'] + (['docs'] if peal_docs_server | bool else []) }}"
# Loopback ports the tunnel reaches (compose.production.yaml).
peal_ports:
  server: 3000
  web: 3001
  site: 4321
  docs: 4322
  docs_server: 4323
  grafana: 13000
  otlp_http: 14318

# What release.yml deploys: a branch, tag or commit of this repository, built
# on the machine running Ansible for each server's architecture, which its
# facts give (linux/amd64 or linux/arm64). Set peal_image_platform to build
# for another.
peal_version: main
peal_release_repo_url: https://github.com/peal-social/peal.git

# Credentials the server needs from outside services, by name. The values
# stay in the vault or on the server; the playbooks only check that each is
# set. Either RESEND_API_KEY or SMTP_URL sends email.
peal_required_credentials:
  - PEAL_S3_ACCESS_KEY_ID
  - PEAL_S3_SECRET_ACCESS_KEY
  - PGBACKREST_REPO1_S3_KEY
  - PGBACKREST_REPO1_S3_KEY_SECRET
  - PGBACKREST_REPO1_CIPHER_PASS
  - TELEGRAM_BOT_TOKEN
  - TELEGRAM_CHAT_ID
# With the docs server (peal_docs_server), its assistant's Anthropic key,
# DOCS_ANTHROPIC_API_KEY, too (peal_runtime's vars).
peal_mail_credentials: [RESEND_API_KEY, SMTP_URL]

# Peal is a host established in France: the law has it keep what identifies
# whoever contributed content (loi n° 2004-575, art. 6, V, A; décret
# n° 2021-1362), which the software does only when told to
# (PEAL_LEGAL_RETENTION). Both environments are Peal's, and keep it.
peal_legal_retention: true

# The hosts of object stores other than Cloudflare R2 whose buckets the
# owner checked are in the EU: nothing in such a store's endpoint says where
# it keeps them, so peal_runtime refuses one that is not listed here. R2's
# EU endpoints need no entry, and its others are refused whatever this says.
peal_storage_eu_hosts: []

# Where the server keeps its ledger of erasures (the id and time of each
# deleted account and workspace, which a restore replays): empty keeps it
# in the media bucket, under erasures/, which suits a media bucket nothing
# serves publicly. Name a private bucket of its own here, on the same R2
# account and reachable with the media token, before giving the media
# bucket a public domain (PEAL_MEDIA_PUBLIC_BASE_URL): peal_runtime refuses
# one without the other.
peal_erasure_ledger_bucket: ""

# What Peal declares about its processing, which each user's copy of their
# data repeats (GDPR Article 15): the controller, the privacy policy's
# address, the supervisory authority and every provider that processes
# users' data (the docs' self-hosting page, "Privacy declaration", gives
# the shape). Empty until the owner confirms the legal entity and the
# providers: declare none on a guess, as users are told it as a fact. The
# server reads it when it starts: site.yml restarts the server that runs
# when it changes.
peal_privacy_declaration: {}

# The uptime server's address that Grafana sends its heartbeat to, every few
# minutes, so the uptime server says when this server's alerting goes silent
# (README.md, "Uptime"). Empty: no heartbeat.
peal_heartbeat_url: ""

# More plain settings for the server, as NAME: value (the docs' environment
# variables page lists them), such as PEAL_AI_PROVIDER: anthropic. Secrets go
# in the credentials instead.
peal_settings: {}

# Paths of the app's host name that Cloudflare Access guards in production:
# Better Auth's admin endpoints and the staff console's API on the server,
# and the staff console's pages on the web app, under /en too, where Next
# serves English pages next-intl's proxy skips (paths with a dot). Each is a
# regular expression cloudflared matches against the path,
# once it has resolved dot segments, backslashes and repeated slashes
# (tests/test_cloudflared.py), in any letter case. The Pulumi project's
# adminPaths and the web app's locales name the same paths, which
# test_admin_paths_agree_across_pulumi_ansible_and_the_web_app checks.
peal_access_paths:
  - path: (?i)^/+api/+auth/+admin(/|$)
    to: server
  - path: (?i)^/+api/+admin(/|$)
    to: server
  - path: (?i)^/+((en|fr)/+)?admin(/|$)
    to: web
# On an environment behind Access throughout (the sandbox), the paths that
# outside services call, which stay open, each with an Access application of
# its own that bypasses Access (README.md): Bluesky reads the client metadata
# and keys under /api/channels/oauth/, Stripe posts its events to the
# webhook, and Meta its data deletion and deauthorize requests, for each of
# its three apps. Each request to the last two is signed, and the server
# checks the signature. tests/test_cloudflared.py checks them against the
# addresses the server lists as called by the platforms' servers
# (peal-server:platform-addresses): a platform's new route joins them here.
peal_access_bypass_paths:
  - path: ^/+api/+channels/+oauth/
    to: server
  - path: ^/+api/+auth/+stripe/+webhook/*$
    to: server
  - path: ^/+api/+data-deletion/+(facebook|instagram|threads)(/+deauthorize)?/*$
    to: server
