---
# Production, on peal.social. The host names are the official ones; the
# other values are placeholders until the Cloudflare account and the server
# exist.
server_hostname: peal-production
peal_environment: production

# Where the server is hosted: the provider, a European company, in lowercase
# as its own site writes it, and the city of its data centre, in lowercase
# English (paris, not the provider's zone, which differs between providers
# for one city). No provider is chosen yet: these are placeholders, which
# the preflight refuses. Nothing else reads them but the uptime server's
# check that it shares neither (group_vars/uptime). README.md, "Choosing a
# provider and a size", says what the stack needs of any provider.
hosting_provider: REPLACE-WITH-THE-PROVIDER-OF-PRODUCTION
hosting_location: REPLACE-WITH-THE-CITY-OF-PRODUCTION

# Host names on the Cloudflare zone. Cloudflare's free certificate covers the
# zone and its first-level subdomains only, so no name goes deeper.
peal_hostnames:
  app: app.peal.social
  site: peal.social
  docs: docs.peal.social
  grafana: grafana.peal.social
  ssh: ssh.peal.social
# Short links, public: https://peal.link/<code> (group_vars/all says how it
# is routed). Its DNS record, which production's Pulumi stack makes in the
# peal.link zone, points to this tunnel, through which cf-connecting-ip
# (AUTH_IP_HEADERS) comes, so each visitor has a redirect limit of their own.
peal_short_link_hostname: peal.link

# Cloudflare Zero Trust: the team (<team>.cloudflareaccess.com) and the
# audience tag of each Access application, which cloudflared and Grafana
# check. Production's Pulumi stack makes the applications, and
# scripts/cloudflare_from_pulumi.py writes their tags, the buckets and
# their endpoints into cloudflare.yml. This file is read after it and would
# win: the commit that adds cloudflare.yml removes cloudflare_access_aud and
# the four storage values below, as the sandbox's main.yml did.
cloudflare_access_team: example-team
cloudflare_access_aud:
  admin: REPLACE-WITH-THE-ADMIN-APPLICATION-AUD
  grafana: REPLACE-WITH-THE-GRAFANA-APPLICATION-AUD
  ssh: REPLACE-WITH-THE-SSH-APPLICATION-AUD
# Production is public; Access guards Grafana, SSH and peal_access_paths.
peal_access_everything: false

# Resend's sending domain is peal.social.
peal_mail_from: Peal <notifications@peal.social>

# Grafana posts a heartbeat to the uptime server every few minutes, which
# alerts when it stops (group_vars/uptime: uptime_hostname, and the external
# endpoint `grafana heartbeat` of the group `production`). Its token is the
# credential PEAL_HEARTBEAT_TOKEN, which the uptime server generates.
peal_heartbeat_url: https://uptime.peal.social/api/v1/endpoints/production_grafana-heartbeat/external?success=true

# Object storage, in the EU: one bucket for media, one for database backups,
# on any store that speaks the S3 API (README.md, "Object storage"). The
# media endpoint is an https:// URL, the backup endpoint a host. These name
# Cloudflare R2, in the account whose id names the endpoint: both buckets
# are created in R2's EU jurisdiction, which cannot change afterwards and
# whose endpoints carry `.eu.`, so the data stays in the EU.
peal_media_endpoint: https://0123456789abcdef0123456789abcdef.eu.r2.cloudflarestorage.com
peal_media_bucket: peal-production-media
peal_backup_endpoint: 0123456789abcdef0123456789abcdef.eu.r2.cloudflarestorage.com
peal_backup_bucket: peal-production-backups
peal_backup_path: /production

# The server samples one trace in ten that begins there, and follows the
# decision a request comes with. Every attempt to publish, every request it
# fails and every slow span is traced whatever the ratio, and logs and
# metrics are never sampled (the docs' environment variables page,
# "Telemetry"). Raise the ratio while you investigate; Tempo keeps 14 days.
peal_settings:
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  # Where the web app sends people who need more than the largest plan
  # allows, a page or a mailto: address. Unset, it tells them to write to
  # whoever runs the server: set it once the address exists.
  # PEAL_CONTACT_URL: https://peal.social/contact/
  # Facebook Pages' and Instagram's comments in the inbox: off until Meta's
  # App Review granted the app their permissions, the privacy policy names
  # them (the registry's inbox entry, then the legal pages, through
  # counsel), and one comment was read, answered, hidden and withdrawn on a
  # test Page and a test Instagram account, a feed video's among them (the
  # engagement context's guide).
  # PEAL_INBOX_PLATFORMS: facebook,instagram
  # Refuses the staff console to staff whose own account does not have
  # two-step verification on: set once every staff account has it on.
  # PEAL_STAFF_TWO_STEP: "true"

# Read when the static image is built.
peal_static_build_args:
  SITE_URL: https://peal.social
  SITE_APP_URL: https://app.peal.social
  SITE_DOCS_URL: https://docs.peal.social
  DOCS_SITE_URL: https://docs.peal.social
  SITE_PLAUSIBLE_DOMAIN: peal.social
  DOCS_PLAUSIBLE_DOMAIN: docs.peal.social
