---
# The uptime server: a server at another European provider than production's
# and the sandbox's, in another city, which checks their public endpoints
# from outside and alerts on Telegram and Slack, and hears production's Grafana's
# heartbeat. It shares nothing with them: no secret, no tunnel, no private
# network, no provider. Its address is a placeholder until the server
# exists.
server_hostname: peal-uptime

# Where it is hosted, as for the other servers (group_vars/production): a
# provider and a city of its own, since an outage, or a suspended account,
# at production's provider must not silence the server that reports it. The
# uptime role refuses a provider or a city that production or the sandbox
# has, and tests/test_hosting.py checks the inventory.
hosting_provider: REPLACE-WITH-THE-PROVIDER-OF-THE-UPTIME-SERVER
hosting_location: REPLACE-WITH-THE-CITY-OF-THE-UPTIME-SERVER

# A server of its own, which uptime.yml gives the same baseline as Peal's
# servers (false), or a host the owner already uses for other sites (true),
# where it runs Gatus alone, on 127.0.0.1, behind the host's own Caddy, and
# leaves SSH, users, packages, Docker and the firewall as they are
# (README.md, "On a shared host"). Set it with the host's address, in
# host_vars/peal-uptime/local.yml.
uptime_shared_host: false

# No tunnel: SSH listens on port 22, key-only and rate limited, and the admin
# user may forward one local port, to Gatus's dashboard on 127.0.0.1:
#   ssh -N -L 8080:127.0.0.1:8080 ops@uptime.peal.social
ssh_via_tunnel: false
uptime_gatus_port: 8080
ssh_tcp_forwarding: local
ssh_permit_open: ["127.0.0.1:{{ uptime_gatus_port }}"]

# A kernel update reboots it an hour after the servers it watches, so it
# watches them through theirs.
unattended_reboot_time: "04:30"

# The settings peal_preflight searches for placeholders.
peal_preflight_names:
  - ansible_host
  - hosting_provider
  - hosting_location
  - admin_ssh_public_keys
  - uptime_hostname
  - uptime_status_hostname
  - uptime_environments

# The uptime server's name, with an A (and AAAA) record to its address that
# Cloudflare does not proxy, which the account's Pulumi stack makes
# (peal:uptime): Caddy gets its certificate for it, and Grafana sends its
# heartbeat to it.
uptime_hostname: uptime.peal.social

# Whether Caddy also serves a public status page, read-only, at
# https://<uptime_status_hostname>/, a name of its own that reads and nothing
# else: the heartbeats keep uptime_hostname. The page is a Gatus of its own
# that checks the customer-facing endpoints of the environments marked
# public, and shows no URL or error; the sandbox, the certificates, DNS and
# the heartbeats stay on the private dashboard. The owner
# chose to publish it (README.md, "Uptime"). It needs a DNS record of its
# own, a CNAME to uptime_hostname that Cloudflare does not proxy, which the
# account's Pulumi stack makes, before uptime.yml runs, or Caddy gets no
# certificate for it. Off, the dashboard is
# reached through SSH alone.
uptime_public_status: true
uptime_status_hostname: status.peal.social

# What it checks: each environment's public host names, as its
# group_vars/<environment>/main.yml has them (peal_hostnames, and
# peal_short_link_hostname as short_links; tests/test_uptime.py keeps them
# equal), for the checks the uptime role lists.
uptime_environments:
  - name: production
    hostnames:
      app: app.peal.social
      site: peal.social
      docs: docs.peal.social
      short_links: peal.link
    # Its Grafana sends a heartbeat (peal_heartbeat_url), with the token
    # PRODUCTION_HEARTBEAT_TOKEN generated here.
    heartbeat: true
    # The public status page shows its customer-facing checks.
    public: true
  - name: sandbox
    hostnames:
      app: sandbox.peal.social
      site: sandbox-site.peal.social
      docs: sandbox-docs.peal.social
      short_links: sandbox.peal.link
    # Behind Cloudflare Access throughout: each check carries the service
    # token SANDBOX_ACCESS_CLIENT_ID and SANDBOX_ACCESS_CLIENT_SECRET.
    access: true
    # Its alerts go to the sandbox's chat, not production's: with the bot
    # SANDBOX_TELEGRAM_BOT_TOKEN, to SANDBOX_TELEGRAM_CHAT_ID.
    telegram: true
    # And on Slack, once SLACK_SANDBOX_ALERTS_WEBHOOK_URL is set, to the
    # sandbox's channel (#alerts-sandbox), not production's.
    slack: true

# The platforms' changelog pages and feeds the platform watch reads every 6
# hours, posting what changed to #platform-changelog once
# SLACK_CHANGELOG_WEBHOOK_URL is set (README.md, "The platform watch"). A
# page is compared with its copy from the last run, a feed (RSS 2.0 or
# Atom) posts its new items; a new source's first run posts nothing.
uptime_platform_watch_sources:
  - name: Graph API changelog
    platform: Meta
    url: https://developers.facebook.com/docs/graph-api/changelog
    kind: page
  - name: Graph API versions
    platform: Meta
    url: https://developers.facebook.com/docs/graph-api/changelog/versions
    kind: page
  - name: Graph API out-of-cycle changes
    platform: Meta
    url: https://developers.facebook.com/docs/graph-api/changelog/out-of-cycle-changes
    kind: page
  - name: Instagram Platform changelog
    platform: Meta
    url: https://developers.facebook.com/docs/instagram-platform/changelog
    kind: page
  - name: Threads changelog
    platform: Meta
    url: https://developers.facebook.com/docs/threads/changelog
    kind: page
  - name: Marketing API changelog
    platform: Meta
    url: https://developers.facebook.com/docs/marketing-api/marketing-api-changelog
    kind: page
  - name: Meta for Developers blog
    platform: Meta
    url: https://developers.facebook.com/blog/feed/
    kind: feed
  - name: Marketing API recent changes
    platform: LinkedIn
    url: https://learn.microsoft.com/en-us/linkedin/marketing/integrations/recent-changes
    kind: page
  - name: Breaking change policy
    platform: LinkedIn
    url: https://learn.microsoft.com/en-us/linkedin/shared/breaking-change-policy
    kind: page
  - name: Data API revision history
    platform: YouTube
    url: https://developers.google.com/youtube/v3/revision_history
    kind: page
  - name: Sunset dates
    platform: Google Business Profile
    url: https://developers.google.com/my-business/content/sunset-dates
    kind: page
  - name: Changelog
    platform: TikTok
    url: https://developers.tiktok.com/doc/changelog
    kind: page
  - name: Changelog
    platform: Pinterest
    url: https://developers.pinterest.com/docs/changelog/changelog/
    kind: page
  - name: API versioning
    platform: X
    url: https://docs.x.com/x-api/fundamentals/versioning
    kind: page
