---
# The uptime server: a server at another European provider than production's
# and the sandbox's, in another city, which checks their public endpoints
# from outside and alerts on Telegram, and hears production's Grafana's
# heartbeat. It shares nothing with them: no secret, no tunnel, no private
# network, no provider. Its address is a placeholder until the server
# exists.
server_hostname: peal-uptime

# Where it is hosted, as for the other servers (group_vars/production): a
# provider and a city of its own, since an outage, or a suspended account,
# at production's provider must not silence the server that reports it. The
# uptime role refuses a provider or a city that production or the sandbox
# has, and tests/test_hosting.py checks the inventory.
hosting_provider: REPLACE-WITH-THE-PROVIDER-OF-THE-UPTIME-SERVER
hosting_location: REPLACE-WITH-THE-CITY-OF-THE-UPTIME-SERVER

# No tunnel: SSH listens on port 22, key-only and rate limited, and the admin
# user may forward one local port, to Gatus's dashboard on 127.0.0.1:
#   ssh -N -L 8080:127.0.0.1:8080 ops@uptime.peal.social
ssh_via_tunnel: false
uptime_gatus_port: 8080
ssh_tcp_forwarding: local
ssh_permit_open: ["127.0.0.1:{{ uptime_gatus_port }}"]

# A kernel update reboots it an hour after the servers it watches, so it
# watches them through theirs.
unattended_reboot_time: "04:30"

# The settings peal_preflight searches for placeholders.
peal_preflight_names:
  - ansible_host
  - hosting_provider
  - hosting_location
  - admin_ssh_public_keys
  - uptime_hostname
  - uptime_status_hostname
  - uptime_environments

# The uptime server's name, with an A (and AAAA) record to its address that
# Cloudflare does not proxy: Caddy gets its certificate for it, and Grafana
# sends its heartbeat to it.
uptime_hostname: uptime.peal.social

# Whether Caddy also serves a public status page, read-only, at
# https://<uptime_status_hostname>/, a name of its own that reads and nothing
# else: the heartbeats keep uptime_hostname. The page is a Gatus of its own
# that checks the customer-facing endpoints of the environments marked
# public, and shows no URL or error; the sandbox, the certificates, DNS and
# the heartbeats stay on the private dashboard. The owner
# chose to publish it (README.md, "Uptime"). It needs a DNS record of its
# own, a CNAME to uptime_hostname that Cloudflare does not proxy, before
# uptime.yml runs, or Caddy gets no certificate for it. Off, the dashboard is
# reached through SSH alone.
uptime_public_status: true
uptime_status_hostname: status.peal.social

# What it checks: each environment's public host names, as its
# group_vars/<environment>/main.yml has them (peal_hostnames, and
# peal_short_link_hostname as short_links; tests/test_uptime.py keeps them
# equal), for the checks the uptime role lists.
uptime_environments:
  - name: production
    hostnames:
      app: app.peal.social
      site: peal.social
      docs: docs.peal.social
      short_links: peal.link
    # Its Grafana sends a heartbeat (peal_heartbeat_url), with the token
    # PRODUCTION_HEARTBEAT_TOKEN generated here.
    heartbeat: true
    # The public status page shows its customer-facing checks.
    public: true
  - name: sandbox
    hostnames:
      app: sandbox.peal.social
      site: sandbox-site.peal.social
      docs: sandbox-docs.peal.social
      short_links: sandbox.peal.link
    # Behind Cloudflare Access throughout: each check carries the service
    # token SANDBOX_ACCESS_CLIENT_ID and SANDBOX_ACCESS_CLIENT_SECRET.
    access: true
