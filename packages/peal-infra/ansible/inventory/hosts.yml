---
# Placeholder hosts: 203.0.113.0/24 is reserved for documentation, so these
# reach nothing. Put each server's public address here when it exists, with
# a comment naming its plan and its provider's zone, or keep it off Git in
# host_vars/<host>/local.yml (Git ignores it), whose ansible_host outranks
# this one; its provider and city go in its group's hosting_provider and
# hosting_location. The playbooks refuse to run while any setting still
# holds a placeholder.
all:
  children:
    # Peal's servers: site.yml and release.yml.
    servers:
      children:
        production:
          hosts:
            peal-production:
              ansible_host: 203.0.113.10
        sandbox:
          hosts:
            peal-sandbox:
              ansible_host: 203.0.113.20
    # The server that checks them from outside: uptime.yml.
    uptime:
      hosts:
        peal-uptime:
          ansible_host: 203.0.113.30
