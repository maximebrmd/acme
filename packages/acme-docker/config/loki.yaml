# Single-process Loki on the local filesystem, for development.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# OTLP logs keep their trace_id and span_id as structured metadata, which
# Grafana links to Tempo.
limits_config:
  allow_structured_metadata: true

analytics:
  reporting_enabled: false
