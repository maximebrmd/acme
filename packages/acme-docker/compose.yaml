# The development stack: `bun nx run acme-docker:up` starts it and waits until
# every service is healthy.
#
# Every port is published on 127.0.0.1 only, and every credential is a
# synthetic development value. Host ports sit in the 1xxxx range (the service's
# usual port with a leading 1) so they stay clear of other local stacks; copy
# .env.example to .env to change any of them.
#
#   Postgres        127.0.0.1:15432   DATABASE_URL=postgres://acme:acme@127.0.0.1:15432/acme
#   S3 (SeaweedFS)  127.0.0.1:18333   bucket "acme-media", key "acme"
#   SeaweedFS filer 127.0.0.1:18888   browse the stored files
#   SMTP (Mailpit)  127.0.0.1:11025   any user and password
#   Mailpit UI      127.0.0.1:18025
#   OTLP gRPC       127.0.0.1:14317   the OpenTelemetry Collector
#   OTLP HTTP       127.0.0.1:14318   OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:14318
#   Grafana         127.0.0.1:13000   anonymous admin
#   Prometheus      127.0.0.1:19090
#   Loki            127.0.0.1:13100
#   Tempo           127.0.0.1:13200

name: acme

# Health checks probe often while a service starts, so `up --wait` returns as
# soon as everything is ready, then settle to every 10 seconds.
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 60s
  start_interval: 1s

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${ACME_POSTGRES_USER:-acme}
      POSTGRES_PASSWORD: ${ACME_POSTGRES_PASSWORD:-acme}
      POSTGRES_DB: ${ACME_POSTGRES_DB:-acme}
    ports:
      - 127.0.0.1:${ACME_POSTGRES_PORT:-15432}:5432
    volumes:
      # Postgres 18 images keep PGDATA in a versioned folder below this one.
      - postgres:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - pg_isready
        - --username=${ACME_POSTGRES_USER:-acme}
        - --dbname=${ACME_POSTGRES_DB:-acme}

  # Master, volume server, filer and S3 gateway in one process. The access key
  # pair below becomes an admin identity, and the media bucket is created at
  # startup if it is missing.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command:
      - mini
      - -dir=/data
      - -bucket=${ACME_S3_BUCKET:-acme-media}
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${ACME_S3_ACCESS_KEY_ID:-acme}
      AWS_SECRET_ACCESS_KEY: ${ACME_S3_SECRET_ACCESS_KEY:-acme-development-secret}
    ports:
      - 127.0.0.1:${ACME_S3_PORT:-18333}:8333
      - 127.0.0.1:${ACME_SEAWEEDFS_FILER_PORT:-18888}:8888
    volumes:
      - seaweedfs:/data
    healthcheck:
      <<: *healthcheck
      # Healthy once the S3 gateway answers and the bucket exists.
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --output /dev/null http://127.0.0.1:8333/healthz &&
          curl --fail --silent --output /dev/null http://127.0.0.1:8888/buckets/${ACME_S3_BUCKET:-acme-media}/

  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # Mailpit looks up each client's reverse DNS before greeting, which takes
      # about 10 s under Docker Desktop and stalls the email tests.
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - 127.0.0.1:${ACME_SMTP_PORT:-11025}:1025
      - 127.0.0.1:${ACME_MAILPIT_PORT:-18025}:8025
    volumes:
      - mailpit:/data
    healthcheck:
      <<: *healthcheck
      test: [CMD, /mailpit, readyz]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      # The collector image has no shell or HTTP client, so the health check
      # borrows busybox's static wget from an image mount.
      - type: image
        source: busybox:1.38.0-musl
        target: /busybox
    ports:
      - 127.0.0.1:${ACME_OTLP_GRPC_PORT:-14317}:4317
      - 127.0.0.1:${ACME_OTLP_HTTP_PORT:-14318}:4318
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, /busybox/bin/wget, -q, -O, /dev/null, http://127.0.0.1:13133/]

  loki:
    image: grafana/loki:3.7.9
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./config/loki.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    ports:
      - 127.0.0.1:${ACME_LOKI_PORT:-13100}:3100
    healthcheck:
      <<: *healthcheck
      test: [CMD, /usr/bin/loki, -health]

  tempo:
    image: grafana/tempo:3.1.1
    command: [-target=all, -config.file=/etc/tempo/config.yaml]
    volumes:
      - ./config/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo:/var/tempo
    ports:
      - 127.0.0.1:${ACME_TEMPO_PORT:-13200}:3200
    healthcheck:
      <<: *healthcheck
      test: [CMD, /tempo, -health]

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus:/prometheus
    ports:
      - 127.0.0.1:${ACME_PROMETHEUS_PORT:-19090}:9090
    healthcheck:
      <<: *healthcheck
      test: [CMD, promtool, check, ready]

  # Anonymous admin with no login form: fine for a stack bound to 127.0.0.1,
  # never for a shared or production Grafana. Grafana 13 logs that an
  # anonymous role other than Viewer is deprecated, but still grants it.
  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana:/var/lib/grafana
    ports:
      - 127.0.0.1:${ACME_GRAFANA_PORT:-13000}:3000
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]

volumes:
  postgres:
  seaweedfs:
  mailpit:
  loki:
  tempo:
  prometheus:
  grafana:
