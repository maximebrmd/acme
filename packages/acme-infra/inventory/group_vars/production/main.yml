---
# Production. Every value below is a placeholder until the domain, the
# Cloudflare account and the server exist.
server_hostname: acme-production
acme_environment: production

# Host names on the Cloudflare zone. Cloudflare's free certificate covers the
# zone and its first-level subdomains only, so no name goes deeper.
acme_hostnames:
  app: app.example.com
  site: example.com
  docs: docs.example.com
  grafana: grafana.example.com
  ssh: ssh.example.com

# Cloudflare Zero Trust: the team (<team>.cloudflareaccess.com) and the
# audience tag of each Access application (Access > Applications > the
# application > Overview), which cloudflared and Grafana check.
cloudflare_access_team: example-team
cloudflare_access_aud:
  admin: REPLACE-WITH-THE-ADMIN-APPLICATION-AUD
  grafana: REPLACE-WITH-THE-GRAFANA-APPLICATION-AUD
  ssh: REPLACE-WITH-THE-SSH-APPLICATION-AUD
# Production is public; Access guards Grafana, SSH and acme_access_paths.
acme_access_everything: false

acme_mail_from: Acme <noreply@example.com>

# Cloudflare R2: one bucket for media, one for database backups, in the
# account whose id names the endpoint.
acme_media_endpoint: https://0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com
acme_media_bucket: acme-production-media
acme_backup_endpoint: 0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com
acme_backup_bucket: acme-production-backups
acme_backup_path: /production

# Read when the static image is built.
acme_static_build_args:
  SITE_URL: https://example.com
  SITE_DOCS_URL: https://docs.example.com
  DOCS_SITE_URL: https://docs.example.com
