---
# The sandbox: pre-production, with its own database, buckets and platform
# redirect URIs, behind Cloudflare Access throughout. Every value below is a
# placeholder until the domain, the Cloudflare account and the server exist.
server_hostname: acme-sandbox
acme_environment: sandbox

# First-level subdomains only: Cloudflare's free certificate covers no
# deeper name, such as app.sandbox.example.com.
acme_hostnames:
  app: sandbox.example.com
  site: site-sandbox.example.com
  docs: docs-sandbox.example.com
  grafana: grafana-sandbox.example.com
  ssh: ssh-sandbox.example.com

cloudflare_access_team: example-team
cloudflare_access_aud:
  # One application covers the sandbox's app, site and docs.
  sandbox: REPLACE-WITH-THE-SANDBOX-APPLICATION-AUD
  grafana: REPLACE-WITH-THE-SANDBOX-GRAFANA-APPLICATION-AUD
  ssh: REPLACE-WITH-THE-SANDBOX-SSH-APPLICATION-AUD
acme_access_everything: true

acme_mail_from: Acme Sandbox <noreply@example.com>

acme_media_endpoint: https://0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com
acme_media_bucket: acme-sandbox-media
acme_backup_endpoint: 0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com
acme_backup_bucket: acme-sandbox-backups
acme_backup_path: /sandbox

acme_static_build_args:
  SITE_URL: https://site-sandbox.example.com
  SITE_DOCS_URL: https://docs-sandbox.example.com
  DOCS_SITE_URL: https://docs-sandbox.example.com
