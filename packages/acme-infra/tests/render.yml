---
# Renders the roles' templates for each server of the inventory into
# render_dir, on this machine, so tests read what each server would get.
# tests/conftest.py runs it; it changes nothing outside render_dir.
- name: Render the templates of Acme's servers
  hosts: servers
  gather_facts: false
  connection: local
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  vars_files:
    - ../roles/cloudflared/defaults/main.yml
    - ../roles/acme_runtime/vars/main.yml
  tasks:
    - name: Create the server's folder
      ansible.builtin.file:
        path: "{{ render_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: "0700"

    - name: Render the tunnel's routes
      ansible.builtin.template:
        src: ../roles/cloudflared/templates/config.yml.j2
        dest: "{{ render_dir }}/{{ inventory_hostname }}/cloudflared.yml"
        mode: "0600"

    - name: Render the host settings
      ansible.builtin.template:
        src: ../roles/acme_runtime/templates/host.env.j2
        dest: "{{ render_dir }}/{{ inventory_hostname }}/host.env"
        mode: "0600"
