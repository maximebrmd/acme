---
# The plain settings host.env gives compose.production.yaml, by name: the
# inventory's, then acme_settings, which may replace them. Secrets are in
# secrets.env (generated on the server) and credentials.env (issued by
# outside services), beside it.
acme_runtime_host_settings: >-
  {{ {
       'PUBLIC_URL': 'https://' ~ acme_hostnames.app,
       'AUTH_IP_HEADERS': 'cf-connecting-ip',
       'MAIL_FROM': acme_mail_from,
       'ACME_S3_ENDPOINT': acme_media_endpoint,
       'ACME_S3_BUCKET': acme_media_bucket,
       'ACME_POSTGRES_ARCHIVE_MODE': 'on',
       'PGBACKREST_REPO1_S3_ENDPOINT': acme_backup_endpoint,
       'PGBACKREST_REPO1_S3_BUCKET': acme_backup_bucket,
       'PGBACKREST_REPO1_PATH': acme_backup_path,
       'ACME_GRAFANA_URL': 'https://' ~ acme_hostnames.grafana,
       'ACME_GRAFANA_ACCESS_TEAM': cloudflare_access_team,
       'ACME_GRAFANA_ACCESS_AUD': cloudflare_access_aud.grafana,
       'ACME_GRAFANA_CONTACT_POINTS': './config/production/grafana/alerting/telegram.yaml',
       'ACME_SERVER_PORT': acme_ports.server,
       'ACME_WEB_PORT': acme_ports.web,
       'ACME_SITE_PORT': acme_ports.site,
       'ACME_DOCS_PORT': acme_ports.docs,
       'ACME_GRAFANA_PORT': acme_ports.grafana,
       'ACME_OTLP_HTTP_PORT': acme_ports.otlp_http,
     }
     | combine(acme_settings) }}
