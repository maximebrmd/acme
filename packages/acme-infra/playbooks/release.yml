---
# Deploy a version of Acme, one server at a time. Run after site.yml:
#   ansible-playbook playbooks/release.yml --limit sandbox
#   ansible-playbook playbooks/release.yml --limit production -e acme_version=<ref>
- name: Release Acme
  hosts: servers
  become: true
  serial: 1
  roles:
    - acme_preflight
    - acme_release
