# The Ansible toolchain for the servers that run Acme, managed with uv:
# `uv sync --locked` installs it in .venv.
[project]
name = "acme-infra"
version = "0.0.0"
description = "Ansible for the servers that run Acme."
license = "FSL-1.1-ALv2"
requires-python = ">=3.14"
dependencies = ["ansible-core==2.22.0", "ansible-lint==26.11.0"]

[tool.uv]
package = false
