# Sends every alert to a Telegram chat. Mount this file as the contact points
# (PEAL_GRAFANA_CONTACT_POINTS) only where TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID are set: Grafana reads them from its environment when it
# starts, and refuses to start without them. telegram-slack.yaml sends the
# same alerts to Slack too.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: Telegram
    receivers:
      - uid: telegram
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_CHAT_ID
          disable_web_page_preview: true

policies:
  - orgId: 1
    receiver: Telegram
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

# telegram-slack.yaml's Slack receiver, once that file is no longer
# mounted: Grafana keeps what it provisioned, so it would linger. Grafana
# starts as well where it never was.
deleteContactPoints:
  - orgId: 1
    uid: slack
