# Alert rules, provisioned read-only. Notifications go where the contact point
# file mounted beside this one says: Telegram in Peal's production
# (telegram.yaml), Grafana's default otherwise (none.yaml).
#
# Requests are counted by the server itself (peal.http.requests, by status
# class), every one of them: its traces are sampled, so the span metrics
# Tempo derives from them show a share of the requests only. The container
# health checks alone keep the count moving while the server runs.

apiVersion: 1

groups:
  - orgId: 1
    name: peal
    folder: Peal
    interval: 1m
    rules:
      - uid: peal-server-silent
        title: The server answers no requests
        condition: B
        for: 5m
        # No series at all means the server, the collector or Tempo is down.
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: peal-server has reported no request for 10 minutes. Check that it runs and that its telemetry reaches the collector.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              expr: sum(rate(peal_http_requests_total[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.01]

      - uid: peal-server-failing-requests
        title: The server fails requests
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: More than 3 requests a minute to peal-server have failed for 10 minutes.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: sum(rate(peal_http_requests_total{status="5xx"}[5m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]

      - uid: peal-server-error-logs
        title: The server logs errors
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: peal-server logged more than 5 errors in 10 minutes. Read them in Grafana's Loki explorer.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              queryType: instant
              # OTLP severity numbers 17 to 24 are errors and fatal errors.
              # The web app's error reports, which the server logs at error
              # level too, have an alert of their own below.
              expr: sum(count_over_time({service_name="peal-server"} | severity_number >= 17 | event_name != "peal.client_error" [10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      - uid: peal-app-refused
        title: A platform refuses the server's app until it is paid for
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A platform refuses every post of this server's app until its account with the platform is paid for (on X, add credits or raise the spending cap in its developer console). The posts wait and are tried again every half hour, for a day after their time.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 4500
              to: 0
            model:
              refId: A
              queryType: instant
              # The server logs the refusal at the first attempt refused,
              # then once an hour while it lasts, whatever the number of
              # posts: over 75 minutes, the alert fires at the first and
              # stays up, once, until the refusals stop.
              expr: sum(count_over_time({service_name="peal-server"} | event_name = "peal.app_refused" [75m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-web-error-spike
        title: The web app reports a spike of errors
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The web app reported more than 20 errors in 10 minutes, from browsers or its own server, those dropped for coming too fast included. Read them on the Peal dashboard's browser errors panels.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # The server counts each report it logs (peal.client_errors)
              # and each its intake drops (peal.client_errors.dropped).
              expr: (sum(increase(peal_client_errors_total[10m])) or vector(0)) + (sum(increase(peal_client_errors_dropped_total[10m])) or vector(0))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [20]

      - uid: peal-backup-stale
        title: The database has no recent backup
        condition: B
        for: 0s
        # No backup has reported in 8 days, or ever.
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: No database backup has finished for 30 hours. Read `journalctl --unit 'peal-backup@*'` on the server.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # Seconds since the last backup finished. A backup reports once,
              # so the sample is searched for over the last 8 days.
              expr: time() - max(max_over_time(peal_backup_last_success_timestamp_seconds[8d]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [108000]

      # peal-backup reports each failure: the last one is newer than the
      # last success until a backup succeeds again. pgBackRest refuses the
      # write-ahead log archive for the same reasons, so this alert is the
      # first sign the archive stopped too.
      - uid: peal-backup-failed
        title: The last database backup failed
        condition: B
        for: 0s
        # A server whose backups never failed has no failure to read; the
        # rule above covers one that never backed up.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The last database backup failed. Read `journalctl --unit 'peal-backup@*'` on the server; pgBackRest's error 028 means the database was started over (packages/peal-infra/ansible/runbooks/restore-database.md, "Starting a server's database over").
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # Seconds from the last success to the last failure, both
              # searched for over 8 days: positive while the failure is newer.
              expr: max(max_over_time(peal_backup_last_failure_timestamp_seconds[8d])) - (max(max_over_time(peal_backup_last_success_timestamp_seconds[8d])) or vector(0))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-disk-almost-full
        title: The server's disk is almost full
        condition: B
        for: 15m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: The root filesystem is more than 85% full. A stuck WAL archive grows until it fills the disk.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              expr: 1 - sum(system_filesystem_usage_bytes{mountpoint="/", state="free"}) / sum(system_filesystem_usage_bytes{mountpoint="/"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.85]

      - uid: peal-raid-degraded
        title: A RAID array is degraded
        condition: B
        for: 0s
        # The host posts the gauge every 15 minutes (the Ansible role
        # peal_disks); a server without the role never does.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: An md array of the server is missing a disk, and runs on the other alone. Read `cat /proc/mdstat` and `sudo mdadm --detail /dev/md1` on the server, then follow runbooks/failed-disk.md.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 2700
              to: 0
            model:
              refId: A
              instant: true
              # The last report of each server, over three of its 15-minute
              # posts: it clears at the first one that says the array is
              # whole.
              expr: max(last_over_time(peal_host_raid_degraded[45m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-disk-failing
        title: A disk reports that it is failing
        condition: B
        for: 0s
        # As peal-raid-degraded: posted by the host, absent without the role,
        # and zero on a disk without SMART, as a virtual machine's.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A disk's SMART says it is failing, or a prefail attribute is at its threshold. Read `sudo smartctl -a /dev/<disk>` on each disk of `lsblk` on the server, then follow runbooks/failed-disk.md.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 2700
              to: 0
            model:
              refId: A
              instant: true
              expr: max(last_over_time(peal_host_disks_failing[45m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-token-refresh-behind
        title: Token refreshes fall behind
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Two or more of the last three token refresh runs stopped at their budget with channels still due (peal.channels.token_sweep.unfinished). Tokens are renewed later than their policy says, and posts on the channels left fail once theirs lapse. Read the server's "token refresh run could not finish" warnings for which platform does not answer.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: A
              instant: true
              # A run every 10 minutes: three in the window.
              expr: sum(increase(peal_channels_token_sweep_unfinished_total[30m])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1.5]

      - uid: peal-collection-behind
        title: The analytics collection falls behind
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Two or more of the last three hourly collections of post counts stopped at their budget with posts still due (peal.analytics.collection.unfinished). Counts are read later than their schedule says. Raise PEAL_ANALYTICS_CONCURRENCY if platforms answer, or read the server's warnings for the one that does not.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: A
              instant: true
              # A run an hour: three in the window.
              expr: sum(increase(peal_analytics_collection_unfinished_total[3h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1.5]

      - uid: peal-accounts-collection-behind
        title: The collection of accounts' numbers falls behind
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Two or more of the last three hourly collections of accounts' followers stopped at their budget with channels still due (peal.analytics.accounts.unfinished). Followers are read later than once a day, and a day may be missed. Raise PEAL_ANALYTICS_CONCURRENCY if platforms answer, or read the server's warnings for the one that does not.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: A
              instant: true
              # A run an hour: three in the window.
              expr: sum(increase(peal_analytics_accounts_unfinished_total[3h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1.5]

      - uid: peal-ads-sync-behind
        title: The sync of ad accounts falls behind
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Two or more of the last three hourly syncs of ad accounts stopped at their budget with accounts still due (peal.ads.sync.unfinished). Campaigns, spend and the check of boosts against their budget are read later than their schedule says. Read the server's warnings for the ad network that does not answer; peal.ads.sync.left says how many accounts wait.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: A
              instant: true
              # A run an hour: three in the window.
              expr: sum(increase(peal_ads_sync_unfinished_total[3h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1.5]

      - uid: peal-comments-behind
        title: The comments collection falls behind
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Three or more of the last six collections of comments stopped at their budget with threads still due (peal.engagement.collection.unfinished). Comments reach the inbox later than their schedule says. Raise PEAL_ENGAGEMENT_CONCURRENCY if platforms answer, or read the server's warnings for the one that does not.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: A
              instant: true
              # A run every 10 minutes: six in the window.
              expr: sum(increase(peal_engagement_collection_unfinished_total[1h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2.5]

      - uid: peal-comments-thread-failing
        title: A thread's comments keep failing to be kept
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Six or more reads of comments could not be kept in three hours (peal.engagement.collection.thread_failures), as one thread that fails at every try, half an hour apart, would. Its comments do not reach the inbox; the other threads are read. The server's warnings name the thread by id, and whether the database refused what it holds or a fault broke on it.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: A
              instant: true
              # A thread that fails is tried again half an hour later.
              expr: sum(increase(peal_engagement_collection_thread_failures_total[3h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5.5]

      - uid: peal-weekly-digest-failing
        title: Weekly digests keep failing
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Ten or more weekly digests did not go in two hours (peal.notifications.weekly_digest.failures), each refused for good, refused for now after its retries (the run then stops, and the next hour's goes on), or for a reader that could not be read. The digests run every hour of Monday, at 19 past. The server's errors and warnings name each reader by id.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 7200
              to: 0
            model:
              refId: A
              instant: true
              expr: sum(increase(peal_notifications_weekly_digest_failures_total[2h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [9.5]

      - uid: peal-comments-forget-failing
        title: Comments past their platform's bound are not forgotten
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The retention failed three times or more in three hours to forget a thread's comments at their platform's bound (peal.engagement.retention.forget_failures), as one thread that fails at every hourly run would. Peal then keeps those comments past what the platform allows (YouTube's 30 days, LinkedIn's day); the other threads are forgotten. The server's warnings name the thread by id.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: A
              instant: true
              # The retention runs every hour.
              expr: sum(increase(peal_engagement_retention_forget_failures_total[3h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2.5]

      - uid: peal-uploads-waiting
        title: Uploads to platforms wait for a slot
        condition: B
        for: 30m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Large uploads to platforms have waited for one of the server's upload slots for 30 minutes (peal.publishing.uploads.waiting), so posts with videos go out late. Raise PEAL_MAX_CONCURRENT_UPLOADS if the server has the memory, or look for an upload that never ends.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # The least that waited over the window: above 0, something
              # waited the whole time.
              expr: min_over_time((sum(peal_publishing_uploads_waiting) or vector(0))[10m:1m])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-recycling-overdue
        title: Repeating posts fall behind
        condition: B
        for: 30m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Recycling rules a run should have made more than 30 minutes ago and did not, those waiting on purpose (a starter locked out, a source awaiting approval) left out (peal.publishing.recycling.overdue), stayed above 0 for 30 minutes, so repeating posts are not made on time. Look at the publishing.recycling cron's logs, which say how many occurrences each run made, left and ended.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # The least seen over the window: above 0, some rule stayed late
              # the whole time.
              expr: min_over_time((max(peal_publishing_recycling_overdue) or vector(0))[10m:1m])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-feeds-overdue
        title: Feeds fall behind
        condition: B
        for: 30m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Active feeds due more than an hour ago and not read (peal.publishing.feeds.overdue) stayed above 0 for 30 minutes, so the posts they make come late. Look at the publishing.feeds cron's logs, which say how many feeds each run read and left, and at peal.publishing.feeds.unfinished, which counts the runs that stopped at their budget.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # The least seen over the window: above 0, some feed stayed late
              # the whole time.
              expr: min_over_time((max(peal_publishing_feeds_overdue) or vector(0))[10m:1m])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-duplicate-subscription
        title: A billing account paid for per-account pricing twice
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Two checkouts of one billing account finished before either was recorded, and the server ended the newer per-account subscription at once, without a charge (peal.billing.duplicate_subscriptions). The customer holds two confirmations. The server's error log names the workspace, the subscription kept and the one ended; check the ended one at Stripe and tell the customer which contract stands.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: A
              instant: true
              # Rare: any in the hour is one too many.
              expr: sum(increase(peal_billing_duplicate_subscriptions_total[1h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-stripe-catalogue
        title: Stripe's catalogue differs from the rate card
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The server started on a Stripe account whose per-account pricing catalogue is not the rate card's (peal.billing.stripe_catalogue.problems above 0); it starts all the same while nothing sells per-account pricing. The server's start log lists what differs. Give Stripe the catalogue with the release's image (sudo peal-compose run --rm --no-deps server packages/peal-server/scripts/stripe-catalogue.ts, peal-infra's README, "Stripe catalogue"), then restart the server.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # Set once when the server starts, and exported from then on;
              # a server that does not bill never sets it.
              expr: max(peal_billing_stripe_catalogue_problems) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
