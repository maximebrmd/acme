# Alert rules, provisioned read-only. Notifications go where the contact point
# file mounted beside this one says: Telegram in Peal's production
# (telegram.yaml), Grafana's default otherwise (none.yaml).
#
# Requests are counted by the server itself (peal.http.requests, by status
# class), every one of them: its traces are sampled, so the span metrics
# Tempo derives from them show a share of the requests only. The container
# health checks alone keep the count moving while the server runs.

apiVersion: 1

groups:
  - orgId: 1
    name: peal
    folder: Peal
    interval: 1m
    rules:
      - uid: peal-server-silent
        title: The server answers no requests
        condition: B
        for: 5m
        # No series at all means the server, the collector or Tempo is down.
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: peal-server has reported no request for 10 minutes. Check that it runs and that its telemetry reaches the collector.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              expr: sum(rate(peal_http_requests_total[10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.01]

      - uid: peal-server-failing-requests
        title: The server fails requests
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: More than 3 requests a minute to peal-server have failed for 10 minutes.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: sum(rate(peal_http_requests_total{status="5xx"}[5m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]

      - uid: peal-server-error-logs
        title: The server logs errors
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: peal-server logged more than 5 errors in 10 minutes. Read them in Grafana's Loki explorer.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              queryType: instant
              # OTLP severity numbers 17 to 24 are errors and fatal errors.
              # The web app's error reports, which the server logs at error
              # level too, have an alert of their own below.
              expr: sum(count_over_time({service_name="peal-server"} | severity_number >= 17 | event_name != "peal.client_error" [10m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      - uid: peal-app-refused
        title: A platform refuses the server's app until it is paid for
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A platform refuses every post of this server's app until its account with the platform is paid for (on X, add credits or raise the spending cap in its developer console). The posts wait and are tried again every half hour, for a day after their time.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 4500
              to: 0
            model:
              refId: A
              queryType: instant
              # The server logs the refusal at the first attempt refused,
              # then once an hour while it lasts, whatever the number of
              # posts: over 75 minutes, the alert fires at the first and
              # stays up, once, until the refusals stop.
              expr: sum(count_over_time({service_name="peal-server"} | event_name = "peal.app_refused" [75m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-web-error-spike
        title: The web app reports a spike of errors
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The web app reported more than 20 errors in 10 minutes, from browsers or its own server, those dropped for coming too fast included. Read them on the Peal dashboard's browser errors panels.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # The server counts each report it logs (peal.client_errors)
              # and each its intake drops (peal.client_errors.dropped).
              expr: (sum(increase(peal_client_errors_total[10m])) or vector(0)) + (sum(increase(peal_client_errors_dropped_total[10m])) or vector(0))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [20]

      - uid: peal-backup-stale
        title: The database has no recent backup
        condition: B
        for: 0s
        # No backup has reported in 8 days, or ever.
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: No database backup has finished for 30 hours. Read `journalctl --unit 'peal-backup@*'` on the server.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # Seconds since the last backup finished. A backup reports once,
              # so the sample is searched for over the last 8 days.
              expr: time() - max(max_over_time(peal_backup_last_success_timestamp_seconds[8d]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [108000]

      # peal-backup reports each failure: the last one is newer than the
      # last success until a backup succeeds again. pgBackRest refuses the
      # write-ahead log archive for the same reasons, so this alert is the
      # first sign the archive stopped too.
      - uid: peal-backup-failed
        title: The last database backup failed
        condition: B
        for: 0s
        # A server whose backups never failed has no failure to read; the
        # rule above covers one that never backed up.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The last database backup failed. Read `journalctl --unit 'peal-backup@*'` on the server; pgBackRest's error 028 means the database was started over (packages/peal-infra/ansible/runbooks/restore-database.md, "Starting a server's database over").
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # Seconds from the last success to the last failure, both
              # searched for over 8 days: positive while the failure is newer.
              expr: max(max_over_time(peal_backup_last_failure_timestamp_seconds[8d])) - (max(max_over_time(peal_backup_last_success_timestamp_seconds[8d])) or vector(0))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-disk-almost-full
        title: The server's disk is almost full
        condition: B
        for: 15m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: The root filesystem is more than 85% full. A stuck WAL archive grows until it fills the disk.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              expr: 1 - sum(system_filesystem_usage_bytes{mountpoint="/", state="free"}) / sum(system_filesystem_usage_bytes{mountpoint="/"})
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.85]

      - uid: peal-raid-degraded
        title: A RAID array is degraded
        condition: B
        for: 0s
        # The host posts the gauge every 15 minutes (the Ansible role
        # peal_disks); a server without the role never does.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: An md array of the server is missing a disk, and runs on the other alone. Read `cat /proc/mdstat` and `sudo mdadm --detail /dev/md1` on the server, then follow runbooks/failed-disk.md.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 2700
              to: 0
            model:
              refId: A
              instant: true
              # The last report of each server, over three of its 15-minute
              # posts: it clears at the first one that says the array is
              # whole.
              expr: max(last_over_time(peal_host_raid_degraded[45m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-disk-failing
        title: A disk reports that it is failing
        condition: B
        for: 0s
        # As peal-raid-degraded: posted by the host, absent without the role,
        # and zero on a disk without SMART, as a virtual machine's.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A disk's SMART says it is failing, or a prefail attribute is at its threshold. Read `sudo smartctl -a /dev/<disk>` on each disk of `lsblk` on the server, then follow runbooks/failed-disk.md.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 2700
              to: 0
            model:
              refId: A
              instant: true
              expr: max(last_over_time(peal_host_disks_failing[45m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-token-refresh-behind
        title: Token refreshes fall behind
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Two or more of the last three token refresh runs stopped at their budget with channels still due (peal.channels.token_sweep.unfinished). Tokens are renewed later than their policy says, and posts on the channels left fail once theirs lapse. Read the server's "token refresh run could not finish" warnings for which platform does not answer.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: A
              instant: true
              # A run every 10 minutes: three in the window.
              expr: sum(increase(peal_channels_token_sweep_unfinished_total[30m])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1.5]

      - uid: peal-collection-behind
        title: The analytics collection falls behind
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Two or more of the last three hourly collections of post counts stopped at their budget with posts still due (peal.analytics.collection.unfinished). Counts are read later than their schedule says. Raise PEAL_ANALYTICS_CONCURRENCY if platforms answer, or read the server's warnings for the one that does not.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: A
              instant: true
              # A run an hour: three in the window.
              expr: sum(increase(peal_analytics_collection_unfinished_total[3h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1.5]

      - uid: peal-accounts-collection-behind
        title: The collection of accounts' numbers falls behind
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Two or more of the last three hourly collections of accounts' followers stopped at their budget with channels still due (peal.analytics.accounts.unfinished). Followers are read later than once a day, and a day may be missed. Raise PEAL_ANALYTICS_CONCURRENCY if platforms answer, or read the server's warnings for the one that does not.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: A
              instant: true
              # A run an hour: three in the window.
              expr: sum(increase(peal_analytics_accounts_unfinished_total[3h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1.5]

      - uid: peal-ads-sync-behind
        title: The sync of ad accounts falls behind
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Two or more of the last three hourly syncs of ad accounts stopped at their budget with accounts still due (peal.ads.sync.unfinished). Campaigns, spend and the check of boosts against their budget are read later than their schedule says. Read the server's warnings for the ad network that does not answer; peal.ads.sync.left says how many accounts wait.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: A
              instant: true
              # A run an hour: three in the window.
              expr: sum(increase(peal_ads_sync_unfinished_total[3h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1.5]

      - uid: peal-comments-behind
        title: The comments collection falls behind
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Three or more of the last six collections of comments stopped at their budget with threads still due (peal.engagement.collection.unfinished). Comments reach the inbox later than their schedule says. Raise PEAL_ENGAGEMENT_CONCURRENCY if platforms answer, or read the server's warnings for the one that does not.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: A
              instant: true
              # A run every 10 minutes: six in the window.
              expr: sum(increase(peal_engagement_collection_unfinished_total[1h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2.5]

      - uid: peal-comments-thread-failing
        title: A thread's comments keep failing to be kept
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Six or more reads of comments could not be kept in three hours (peal.engagement.collection.thread_failures), as one thread that fails at every try, half an hour apart, would. Its comments do not reach the inbox; the other threads are read. The server's warnings name the thread by id, and whether the database refused what it holds or a fault broke on it.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: A
              instant: true
              # A thread that fails is tried again half an hour later.
              expr: sum(increase(peal_engagement_collection_thread_failures_total[3h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5.5]

      - uid: peal-weekly-digest-failing
        title: Weekly digests keep failing
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Ten or more weekly digests did not go in two hours (peal.notifications.weekly_digest.failures), each refused for good by the mail transport or for a reader that could not be read. The digests run every hour of Monday from 06:19 UTC. The server's errors name each reader by id.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 7200
              to: 0
            model:
              refId: A
              instant: true
              # A counter born at its first failure has no sample before it.
              expr: (sum(increase(peal_notifications_weekly_digest_failures_total{reason!="deferred"}[2h])) or vector(0)) + (sum(peal_notifications_weekly_digest_failures_total{reason!="deferred"} unless peal_notifications_weekly_digest_failures_total{reason!="deferred"} offset 2h) or vector(0))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [9.5]

      - uid: peal-weekly-digest-deferred
        title: The mail transport keeps refusing weekly digests for now
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Two or more weekly digests were refused for now in three hours (peal.notifications.weekly_digest.failures, reason deferred), after their retries. Each is left to the next hourly run, the last at 23:19 UTC on Monday; three in a row stop a run, as the transport is then down. Check the mail transport (Resend or SMTP) and the server's warnings, which name each reader by id.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: A
              instant: true
              # A counter born at its first deferral has no sample before it.
              expr: (sum(increase(peal_notifications_weekly_digest_failures_total{reason="deferred"}[3h])) or vector(0)) + (sum(peal_notifications_weekly_digest_failures_total{reason="deferred"} unless peal_notifications_weekly_digest_failures_total{reason="deferred"} offset 3h) or vector(0))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1.5]

      - uid: peal-comments-forget-failing
        title: Comments past their platform's bound are not forgotten
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The retention failed three times or more in three hours to forget a thread's comments at their platform's bound (peal.engagement.retention.forget_failures), as one thread that fails at every hourly run would. Peal then keeps those comments past what the platform allows (YouTube's 30 days, LinkedIn's day); the other threads are forgotten. The server's warnings name the thread by id.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: A
              instant: true
              # The retention runs every hour.
              expr: sum(increase(peal_engagement_retention_forget_failures_total[3h])) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2.5]

      - uid: peal-media-sweep-failing
        title: A sweep of the media store keeps failing
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The sweeps of the media store failed three times or more in three hours (peal.media.sweep.failures, labelled by sweep), as one that fails at every hourly run, or a store that refuses them all, would. The store then keeps uploads never completed, multipart uploads left open, files no media holds or, for the folders sweep, the files of a deleted workspace, which erasure must remove. The server's warnings name the sweep and give the cause; check the store's credentials and reach, then wait for the next run.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: A
              instant: true
              # The sweeps run every hour. A series that was there in the day before the window counts its increase, a restart's included; one born in the window, which increase never sees at its first sample, counts whole. A gap in the telemetry shorter than a day is not read as a birth.
              expr: (sum(increase(peal_media_sweep_failures_total[3h]) unless (peal_media_sweep_failures_total unless max_over_time(peal_media_sweep_failures_total[1d] offset 3h))) or vector(0)) + (sum(peal_media_sweep_failures_total unless max_over_time(peal_media_sweep_failures_total[1d] offset 3h)) or vector(0))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2.5]

      - uid: peal-media-sweep-refused
        title: A sweep of the media store refuses to delete
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A sweep of the media store deleted nothing on purpose (peal.media.sweep.refusals, by sweep and reason). foreign - the media folder's owner marker (media/.owner) names another database; unmarked - this database wrote the marker and it is gone; restored - the marker names another Postgres cluster or timeline, as after a restore, a failover, pg_upgrade or a database loaded from a dump; rewound - the marker counts more owned runs than the database, which went back in time; contended - the marker changed while a run moved it on; breaker - a page of the bucket held more files the database does not know of, or more workspaces held uploads never completed, than a sound database leaves; the claim does not clear it - once the database is known sound, raise PEAL_MEDIA_SWEEP_ORPHANS_LIMIT or PEAL_MEDIA_SWEEP_PENDING_LIMIT for a run and restart the server. This database may not be the bucket's newest truth. Set PEAL_MEDIA_SWEEPS=off if in doubt, and for the other reasons, once the database is meant to own the folder, hand it over as packages/peal-infra/ansible/runbooks/restore-database.md step 7 says - sudo peal-compose run --rm --no-deps server packages/peal-server/src/claim-media-folder.ts, which shows what it would write, then again with --yes.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 7200
              to: 0
            model:
              refId: A
              instant: true
              # The sweeps run every hour, and a refusing one refuses at each run: two hours see one. A series born in the window counts whole.
              expr: (sum(increase(peal_media_sweep_refusals_total[2h]) unless (peal_media_sweep_refusals_total unless max_over_time(peal_media_sweep_refusals_total[1d] offset 2h))) or vector(0)) + (sum(peal_media_sweep_refusals_total unless max_over_time(peal_media_sweep_refusals_total[1d] offset 2h)) or vector(0))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-uploads-waiting
        title: Uploads to platforms wait for a slot
        condition: B
        for: 30m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Large uploads to platforms have waited for one of the server's upload slots for 30 minutes (peal.publishing.uploads.waiting), so posts with videos go out late. Raise PEAL_MAX_CONCURRENT_UPLOADS if the server has the memory, or look for an upload that never ends.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # The least that waited over the window: above 0, something
              # waited the whole time.
              expr: min_over_time((sum(peal_publishing_uploads_waiting) or vector(0))[10m:1m])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-recycling-overdue
        title: Repeating posts fall behind
        condition: B
        for: 30m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Recycling rules a run should have made more than 30 minutes ago and did not, those waiting on purpose (a starter locked out, a source awaiting approval) left out (peal.publishing.recycling.overdue), stayed above 0 for 30 minutes, so repeating posts are not made on time. Look at the publishing.recycling cron's logs, which say how many occurrences each run made, left and ended.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # The least seen over the window: above 0, some rule stayed late
              # the whole time.
              expr: min_over_time((max(peal_publishing_recycling_overdue) or vector(0))[10m:1m])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-feeds-overdue
        title: Feeds fall behind
        condition: B
        for: 30m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Active feeds due more than an hour ago and not read (peal.publishing.feeds.overdue) stayed above 0 for 30 minutes, so the posts they make come late. Look at the publishing.feeds cron's logs, which say how many feeds each run read and left, and at peal.publishing.feeds.unfinished, which counts the runs that stopped at their budget.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # The least seen over the window: above 0, some feed stayed late
              # the whole time.
              expr: min_over_time((max(peal_publishing_feeds_overdue) or vector(0))[10m:1m])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-duplicate-subscription
        title: A billing account paid for per-account pricing twice
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Two checkouts of one billing account finished before either was recorded, and the server ended the newer per-account subscription at once, without a charge (peal.billing.duplicate_subscriptions). The customer holds two confirmations. The server's error log names the workspace, the subscription kept and the one ended; check the ended one at Stripe and tell the customer which contract stands.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: A
              instant: true
              # Rare: any in the hour is one too many; the hour's increase, a
              # restart's included, and a series born in the last five minutes
              # counted whole (one present five minutes ago is not new, so a
              # gap in the telemetry an hour ago is not read as a birth).
              expr: (sum(increase(peal_billing_duplicate_subscriptions_total[1h])) or vector(0)) + (sum(peal_billing_duplicate_subscriptions_total unless peal_billing_duplicate_subscriptions_total offset 1h unless peal_billing_duplicate_subscriptions_total offset 5m) or vector(0))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-stripe-catalogue
        title: Stripe's catalogue differs from the rate card
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The server started on a Stripe account whose per-account pricing catalogue is not the rate card's (peal.billing.stripe_catalogue.problems above 0); it starts all the same while nothing sells per-account pricing. The server's start log lists what differs. Give Stripe the catalogue with the release's image (sudo peal-compose run --rm --no-deps server packages/peal-server/scripts/stripe-catalogue.ts, peal-infra's README, "Stripe catalogue"), then restart the server.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # Set once when the server starts, and exported from then on;
              # a server that does not bill never sets it.
              expr: max(peal_billing_stripe_catalogue_problems) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-usage-report-behind
        title: Usage waits to reach Stripe
        condition: B
        for: 15m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The oldest meter event in the outbox to Stripe was written more than 6 hours ago (peal.billing.usage_report.oldest_age, with peal.billing.usage_report.left the events waiting), so per-account pricing's usage is billed late, and may land on the next month's invoice. Look at the billing.usage-report cron's logs, which say how many events each run sent, deferred and left; Stripe not answering, or limiting the rate, defers a customer's events to the next run. Nothing is to be reported by hand; each event goes once Stripe takes it.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # Set by each run on a server that bills; one that does not never sets it.
              expr: max(peal_billing_usage_report_oldest_age) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [21600]

      - uid: peal-usage-report-stopped
        title: The reporter of usage to Stripe stopped
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The reporter of usage to Stripe (the billing.usage-report cron, every five minutes) has not ended a run for 30 minutes since the server started or since its last run (peal.billing.usage_report.ran_at), so nothing of per-account pricing's usage reaches Stripe. Look at the server's logs for the cron's failures ("Reporting usage to Stripe failed") and at the cluster's runners.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # Set when a server that bills starts, then by each run: no data where nothing bills.
              expr: time() - max(peal_billing_usage_report_ran_at)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1800]

      - uid: peal-usage-report-refused
        title: Stripe refused usage for good
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The outbox to Stripe keeps meter events Stripe refused for the event's own fault, its value, timestamp or customer (peal.billing.usage_report.refused_kept above 0); their usage is not billed. The server's error log ("Stripe refused a meter event for good") gives Stripe's error code, the event name and its identifier, and billing.meter_reports keeps the event with its refusal. Read the event in Stripe's dashboard before anything else; never report usage again by hand, as Stripe may hold it already. Fix the cause with the owner, then clear the row's refusal so the reporter sends it under its identifier.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # A state, not an event: it fires on the first refusal and while one is kept.
              expr: max(peal_billing_usage_report_refused_kept) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-usage-report-key-refused
        title: Stripe refuses the server's meter events
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Stripe refused meter events for what is not the event's own (peal.billing.usage_report.paused customers left by the last runs); the server's key, its permissions, a restricted account, a meter missing or an idempotency key reused otherwise. Nothing is lost; the events wait and go once Stripe takes them. Check STRIPE_SECRET_KEY and its permissions (meter events), the account's state in Stripe's dashboard, and stripe-catalogue --check; the server's warnings name the event.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # Customers paused by the last run; 0 once Stripe takes them.
              expr: max(peal_billing_usage_report_paused) or vector(0)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-account-days-unstarted
        title: Today's account-days are not started
        condition: B
        for: 65m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Today's account-days were not started for every billing account by 02:00 UTC, nor by the hourly run after it (peal.billing.account_days.started_day, with peal.billing.account_days.started of peal.billing.account_days.accounts); a paying account whose day is not started is not billed for it unless it connects something. The 00:11 snapshot starts the day and billing.account-days starts it again every hour at minute 49; their warnings ("Starting a batch of the day's account-days failed") say why.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              instant: true
              # The last day started whole, set to the day before when a server that bills starts: past 26 hours from its first second, today is not started at 02:00.
              expr: time() - max(peal_billing_account_days_started_day)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [93600]

      - uid: peal-threshold-unset
        title: A per-account subscription has no billing threshold
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Stripe refused the unverified billing threshold to a per-account subscription (peal.billing.threshold_unset); it is recorded and entitled without it, held to 100 accounts, and its usage is invoiced only at the end of the month. The server's error log names the workspace; billing.usage-items sets it again every day. Check the subscription in Stripe's dashboard, and the sandbox runbook's threshold step.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: A
              instant: true
              # The hour's increase, a restart's included, and a series born in the last five minutes counted whole: one present five minutes ago is not new, so a gap in the telemetry an hour ago is not read as a birth.
              expr: (sum(increase(peal_billing_threshold_unset_total[1h])) or vector(0)) + (sum(peal_billing_threshold_unset_total unless peal_billing_threshold_unset_total offset 1h unless peal_billing_threshold_unset_total offset 5m) or vector(0))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: peal-meter-errors
        title: Stripe could not count meter events it took
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Stripe reported meter events it took and could not count, a meter archived or missing, a customer unknown, a value it cannot read (peal.billing.meter_errors, from its meter error events at /api/stripe/meter-errors); their usage is not billed. The server's error log ("Stripe reported meter events it could not count") gives each code and count, and the reports Stripe named are kept refused in billing.meter_reports (stripe:<code>). Read the meter and the customer in Stripe's dashboard and stripe-catalogue --check; never report usage by hand before Stripe's own summaries say what it holds.
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: A
              instant: true
              # The hour's increase, a restart's included, and a series born in
              # the last five minutes counted whole: one present five minutes
              # ago is not new, so a gap in the telemetry an hour ago is not
              # read as a birth.
              expr: (sum(increase(peal_billing_meter_errors_total[1h])) or vector(0)) + (sum(peal_billing_meter_errors_total unless peal_billing_meter_errors_total offset 1h unless peal_billing_meter_errors_total offset 5m) or vector(0))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
