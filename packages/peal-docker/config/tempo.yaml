# Monolithic Tempo (-target=all) on the local filesystem, for development.
# Tempo 3 needs no Kafka in this mode.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# Span metrics and the service graph, written to Prometheus so Grafana can
# draw service maps and link metrics to traces through exemplars.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# A trace can be fetched by id (from a log line in Grafana) within seconds of
# arriving; TraceQL search finds it once the live-store cuts its block, every
# 30 seconds by default.

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
