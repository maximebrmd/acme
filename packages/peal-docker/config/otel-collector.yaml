# Receives OTLP from peal-server and the other apps, then sends traces to
# Tempo, logs to Loki and metrics to Prometheus.

extensions:
  # Probed by the compose health check from inside the container only.
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Loki ingests OTLP natively and keeps resource attributes as labels or
  # structured metadata (trace_id and span_id among them).
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  # Pushed to Prometheus's remote write receiver, which Tempo's
  # metrics-generator also writes to. The exporter drops delta sums, so apps
  # keep the cumulative temporality that Effect uses by default.
  prometheus_remote_write:
    http:
      endpoint: http://prometheus:9090/api/v1/write
      tls:
        insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus_remote_write]
  telemetry:
    # The collector's own metrics, scraped by Prometheus.
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
