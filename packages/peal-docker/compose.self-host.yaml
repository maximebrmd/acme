# For self-hosters: Caddy in front of the production stack, with a Let's
# Encrypt certificate for PEAL_DOMAIN. Copy self-host.env.example to a file
# of your own, fill it in, then, from this folder:
#
#   docker compose --project-name peal --file compose.production.yaml \
#     --file compose.self-host.yaml --env-file peal.env up --detach --wait
#
# Caddy is the one service that publishes ports to the world: 80 for the
# certificate challenge and the redirect to HTTPS, 443 for HTTPS and HTTP/3.
# Docker opens them whatever the host's firewall says. Every other port stays
# on 127.0.0.1.

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    # Caddy writes only its certificates and state, in the volumes below.
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
    environment:
      PEAL_DOMAIN: ${PEAL_DOMAIN:?Set PEAL_DOMAIN, the host name of PUBLIC_URL}
      PEAL_SITE_DOMAIN: ${PEAL_SITE_DOMAIN:-}
      PEAL_DOCS_DOMAIN: ${PEAL_DOCS_DOMAIN:-}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./self-host/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and their keys.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
      # Caddy's admin API, which listens on localhost inside the container.
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]

volumes:
  caddy-data:
  caddy-config:
