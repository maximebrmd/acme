[package]
name = "peal-sdk"
version = "0.3.0"
edition = "2021"
description = "Client for the Peal API: schedule social media posts across platforms."
license = "Apache-2.0"
repository = "https://github.com/peal-social/peal"
documentation = "https://docs.rs/peal-sdk"
homepage = "https://peal.social"
authors = ["Peal <hello@peal.social>"]
keywords = ["peal", "social-media", "scheduling", "api", "sdk"]
# Files this repository needs and the crate does not: Nx's project, Fern's
# records, the smoke test (scripts/test.ts runs it).
exclude = ["project.json", ".fern", ".fernignore", "examples/smoke.rs"]

[lib]
doctest = false

[dependencies]
bytes = "1.0"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

